// ─── TOAST ──────────────────────────────────────────────────────
function showToast(msg, type = 'info') {
  let el = document.getElementById('_bova_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_bova_toast';
    el.style.cssText = `position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;
      padding:0.9rem 1.4rem;font-family:'Barlow Condensed',sans-serif;
      font-size:0.82rem;letter-spacing:0.08em;color:#f0e6cc;
      border-left:3px solid #c09030;background:#0a0802;
      box-shadow:0 8px 32px rgba(0,0,0,0.5);
      transform:translateX(120%);opacity:0;
      transition:all 0.35s cubic-bezier(0.34,1.2,0.64,1);max-width:280px;`;
    document.body.appendChild(el);
  }
  el.style.borderLeftColor = type === 'error' ? '#8a1e10' : '#c09030';
  el.textContent = msg;
  el.style.transform = 'translateX(0)';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.style.transform = 'translateX(120%)';
    el.style.opacity = '0';
  }, 3800);
}

// ─── STORAGE KEY ────────────────────────────────────────────────
const SESSION_KEY = 'bova_session_v1';

function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; }
}
function setSession(data) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}
function isAdmin(email) {
