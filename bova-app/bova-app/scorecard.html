<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Enter Scores — Bova Invitational</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1008;--gold:#c09030;--gold-l:#d4aa50;--gold-p:#e8cc80;--cream:#f0e6cc;--red:#8a1e10;--green:#1a4010;--border:rgba(192,144,48,0.18);--bg:#0a0702;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--cream);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;-webkit-user-select:none;user-select:none;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:rgba(10,7,2,0.98);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Playfair Display',serif;font-size:0.85rem;font-weight:700;}
.nav-logo em{font-style:italic;color:var(--gold);}
.nav-right{display:flex;gap:0.8rem;align-items:center;}
.nav-link{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(240,230,204,0.4);text-decoration:none;}
.nav-link:hover{color:var(--gold);}

/* SETUP SCREEN */
.setup{max-width:420px;margin:0 auto;padding:2rem 1.5rem;}
.setup-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;margin-bottom:0.3rem;}
.setup-title em{font-style:italic;color:var(--gold-p);}
.setup-sub{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.35em;text-transform:uppercase;color:rgba(240,230,204,0.3);margin-bottom:2rem;}
.fg{display:flex;flex-direction:column;gap:0.3rem;margin-bottom:1.2rem;}
.fg label{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);}
.fg label .opt-tag{font-size:0.4rem;letter-spacing:0.1em;color:rgba(240,230,204,0.25);text-transform:none;margin-left:0.4rem;}
.fg select,.fg input{background:rgba(10,6,2,0.7);border:1px solid var(--border);padding:0.75rem 0.85rem;color:var(--cream);font-family:'Barlow',sans-serif;font-size:1rem;outline:none;width:100%;-webkit-appearance:none;border-radius:0;}
.fg select:focus,.fg input:focus{border-color:var(--gold);}
.fg select option{background:#1a1008;}
.setup-divider{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.3em;text-transform:uppercase;color:rgba(240,230,204,0.2);padding:0.5rem 0;margin-bottom:0.2rem;}
.start-btn{width:100%;padding:1rem;background:var(--gold);color:var(--ink);border:none;font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;margin-top:0.5rem;}
.start-btn:hover{background:var(--gold-l);}
.setup-err{font-family:'DM Mono',monospace;font-size:0.5rem;color:var(--red);margin-top:0.5rem;display:none;}
.setup-err.show{display:block;}

/* NO ROUND */
.no-round{text-align:center;padding:4rem 2rem;font-family:'Playfair Display',serif;font-style:italic;color:rgba(240,230,204,0.25);}
.no-round strong{display:block;font-size:1.2rem;margin-bottom:0.5rem;font-style:normal;}

/* SCORECARD */
.scorecard{display:none;max-width:560px;margin:0 auto;}

/* Progress bar */
.progress-wrap{padding:0.8rem 1.2rem;background:rgba(192,144,48,0.04);border-bottom:1px solid var(--border);}
.progress-info{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.5rem;}
.progress-hole{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;}
.progress-toPar{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;}
.progress-toPar.under{color:#4a9a40;}
.progress-toPar.over{color:var(--red);}
.progress-toPar.even{color:rgba(240,230,204,0.5);}
.progress-bar-track{height:2px;background:rgba(192,144,48,0.12);}
.progress-bar-fill{height:100%;background:var(--gold);transition:width 0.3s ease;}

/* Hole card */
.hole-card{padding:1rem 1.2rem;}
.hole-header{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1rem;}
.hole-main-info{flex:1;}
.hole-label{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.4em;text-transform:uppercase;color:rgba(240,230,204,0.3);margin-bottom:0.2rem;}
.hole-num{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:900;color:var(--cream);line-height:1;}
.hole-par{font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-top:0.2rem;}
.format-badge{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.18rem 0.5rem;border:1px solid rgba(192,144,48,0.3);color:rgba(192,144,48,0.6);white-space:nowrap;align-self:flex-start;}

/* ── FOURSOME GRID ── */
.foursome-cols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);}
.foursome-col{background:var(--bg);padding:0.7rem 0.65rem;}
.col-header{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.22em;text-transform:uppercase;padding-bottom:0.45rem;margin-bottom:0.55rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.4rem;}
.col-header.team-a{color:var(--gold);}
.col-header.team-b{color:#6a8aaa;}
.col-live-dot{width:5px;height:5px;border-radius:50%;background:#4a9a40;animation:pulse 1.8s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.45;transform:scale(0.7);}}

/* Player block within column */
.col-player{margin-bottom:0.9rem;}
.col-player:last-of-type{margin-bottom:0;}
.col-player-name{font-family:'Playfair Display',serif;font-size:0.75rem;font-weight:700;margin-bottom:0.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Score stepper (editable) */
.score-stepper{display:flex;align-items:center;justify-content:center;}
.stepper-btn{width:40px;height:40px;background:none;border:1px solid var(--border);color:var(--cream);font-size:1.3rem;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.stepper-btn:active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.stepper-val{min-width:42px;height:40px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:900;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:0 3px;}
.stepper-val.birdie,.opp-num.birdie{color:#4a9a40;}
.stepper-val.eagle,.opp-num.eagle{color:#4a9a40;}
.stepper-val.bogey,.opp-num.bogey{color:var(--red);}
.stepper-val.double,.opp-num.double{color:var(--red);}
.stepper-val.par,.opp-num.par{color:var(--cream);}
.stepper-val.empty,.opp-num.empty{color:rgba(240,230,204,0.2);}
.score-label{text-align:center;margin-top:0.28rem;font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.14em;text-transform:uppercase;height:0.85rem;}
.score-label.birdie,.opp-rel.birdie{color:#4a9a40;}
.score-label.eagle,.opp-rel.eagle{color:#4a9a40;}
.score-label.bogey,.opp-rel.bogey{color:var(--red);}
.score-label.double,.opp-rel.double{color:var(--red);}
.score-label.par,.opp-rel.par{color:rgba(240,230,204,0.3);}

/* Opponent read-only display */
.opp-score-box{display:flex;align-items:center;gap:0.45rem;}
.opp-num{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:900;line-height:1;}
.opp-rel{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
.opp-waiting{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(240,230,204,0.18);padding:0.4rem 0;}
@keyframes scoreFlash{0%{background:rgba(74,154,64,0.18);}100%{background:transparent;}}
.score-flash{animation:scoreFlash 0.7s ease forwards;}

/* Best ball note */
.best-ball-note{margin-top:0.45rem;text-align:center;font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.1em;color:var(--gold);min-height:1rem;}

/* Scramble shared display */
.scramble-label{text-align:center;font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,230,204,0.3);margin-bottom:0.5rem;}
.scramble-opp-box{text-align:center;padding:0.4rem 0;}

/* Navigation */
.hole-nav{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-top:1.2rem;}
.nav-btn{padding:0.9rem;background:var(--bg);border:none;font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;color:rgba(240,230,204,0.5);transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
.nav-btn:hover{background:rgba(192,144,48,0.08);color:var(--gold);}
.nav-btn.next{color:var(--gold);}
.nav-btn.next:hover{background:var(--gold);color:var(--ink);}
.nav-btn:disabled{opacity:0.25;cursor:not-allowed;}

/* Mini scorecard strip */
.mini-strip{padding:0.75rem 1.2rem;border-top:1px solid var(--border);display:flex;gap:3px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mini-hole{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
.mini-num{font-family:'DM Mono',monospace;font-size:0.4rem;color:rgba(240,230,204,0.25);}
.mini-score{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:0.52rem;border-radius:2px;}
.ms-birdie{background:rgba(74,154,64,0.3);color:#4a9a40;}
.ms-eagle{background:rgba(74,154,64,0.5);color:#4a9a40;outline:1px solid #4a9a40;}
.ms-bogey{background:rgba(138,30,16,0.25);color:var(--red);}
.ms-double{background:rgba(138,30,16,0.45);color:var(--red);outline:1px solid var(--red);}
.ms-par{background:rgba(240,230,204,0.06);color:rgba(240,230,204,0.35);}
.ms-empty{background:rgba(240,230,204,0.03);color:rgba(240,230,204,0.1);}
.ms-current{outline:1px solid var(--gold);}

/* Submit */
.submit-section{padding:1.5rem 1.2rem;}
.submit-btn{width:100%;padding:1rem;background:var(--gold);color:var(--ink);border:none;font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;}
.submit-btn:hover{background:var(--gold-l);}
.submit-btn:disabled{background:rgba(192,144,48,0.3);cursor:not-allowed;}

/* Running totals */
.round-summary{padding:1.5rem 1.2rem;border-top:1px solid var(--border);}
.summary-title{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.3em;text-transform:uppercase;color:rgba(240,230,204,0.3);margin-bottom:1rem;}
.summary-row{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(192,144,48,0.06);font-size:0.82rem;}
.summary-row:last-child{border-bottom:none;}
.summary-score{font-family:'Playfair Display',serif;font-weight:700;}
.summary-score.under{color:#4a9a40;}
.summary-score.over{color:var(--red);}
.summary-score.even{color:var(--cream);}
.summary-divider{height:1px;background:var(--border);margin:0.5rem 0;}
.summary-name-opp{color:rgba(240,230,204,0.45);}

/* Saving indicator */
.saving{position:fixed;top:60px;right:1rem;font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity 0.3s;}
.saving.show{opacity:1;}

/* Loading */
.loading{text-align:center;padding:3rem;font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.3em;text-transform:uppercase;color:rgba(240,230,204,0.25);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">Bova <em>Invt.</em></div>
  <div class="nav-right">
    <a href="/scoreboard" class="nav-link">Leaderboard</a>
    <a href="/directory" class="nav-link">Directory</a>
    <a href="/" class="nav-link">Home</a>
  </div>
</nav>

<div class="saving" id="savingIndicator">Saving...</div>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="setup">
  <div class="setup-title">Score <em>Entry</em></div>
  <div class="setup-sub">Foursome scorecard</div>

  <div id="noRoundMsg" class="no-round" style="display:none;">
    <strong>No Active Round</strong>
    Scoring opens when the admin starts a round. Check back soon.
  </div>

  <div id="setupForm">
    <!-- Your side -->
    <div class="fg">
      <label>Your Name</label>
      <select id="scorerSelect">
        <option value="">Select your name...</option>
      </select>
    </div>
    <div class="fg">
      <label>Your Team</label>
      <select id="teamSelect">
        <option value="">Select your team...</option>
        <option value="A">Team Bova</option>
        <option value="B">The Challengers</option>
      </select>
    </div>
    <div class="fg" id="partnerWrap">
      <label>Teammate in your foursome</label>
      <select id="partnerSelect">
        <option value="">Select teammate...</option>
      </select>
    </div>

    <!-- Opponents -->
    <div class="setup-divider">Opponents in your group</div>
    <div class="fg">
      <label>Opponent 1 <span class="opt-tag">optional — shows their scores live</span></label>
      <select id="opp1Select">
        <option value="">Select opponent...</option>
      </select>
    </div>
    <div class="fg">
      <label>Opponent 2 <span class="opt-tag">optional</span></label>
      <select id="opp2Select">
        <option value="">Select opponent...</option>
      </select>
    </div>

    <div class="setup-err" id="setupErr">Please fill in all required fields.</div>
    <button class="start-btn" onclick="startScoring()">Start Scoring</button>
  </div>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" class="scorecard">

  <div class="progress-wrap">
    <div class="progress-info">
      <span class="progress-hole" id="progressHoleLabel">Hole 1</span>
      <span class="progress-toPar even" id="progressToPar">E</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="mini-strip" id="miniStrip"></div>

  <div class="hole-card">
    <div class="hole-header">
      <div class="hole-main-info">
        <div class="hole-label">Hole</div>
        <div class="hole-num" id="holeNum">1</div>
        <div class="hole-par" id="holePar">Par 4</div>
      </div>
      <div class="format-badge" id="formatBadge">Stroke Play</div>
    </div>

    <div id="foursomeGrid"></div>

    <div class="hole-nav">
      <button class="nav-btn" id="prevBtn" onclick="prevHole()" disabled>&larr; Previous</button>
      <button class="nav-btn next" id="nextBtn" onclick="nextHole()">Next &rarr;</button>
    </div>
  </div>

  <div class="round-summary">
    <div class="summary-title">Running Totals</div>
    <div id="summaryRows"></div>
  </div>

  <div class="submit-section">
    <button class="submit-btn" id="submitBtn" onclick="submitRound()">Submit Round Scores</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://jllugkiojeoopitdvzsa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DnBMNLaSu61ykJ6P_fI2fw_D9DdAScn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_PARS = {
  day1:[3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3],
  day2:[4,4,5,3,4,4,3,5,4,4,4,3,5,4,4,3,5,4],
  day3:[4,4,5,3,4,4,3,5,4,4,4,3,5,4,4,3,5,4],
};
const DEFAULT_FORMATS = {
  day1: { front: 'stroke',    back: 'stroke'    },
  day2: { front: 'scramble',  back: 'shamble'   },
  day3: { front: 'best_ball', back: 'stroke'    },
};

let players = [];
let teamAssignments = {};
let currentRound = null;
let coursePars = [];
let roundFormats = JSON.parse(JSON.stringify(DEFAULT_FORMATS));

// Foursome state
let scorerPlayer  = null;
let partnerPlayer = null;
let opp1Player    = null;
let opp2Player    = null;
let scorerTeam    = null;
let currentHole   = 1;

// Scores: enteredScores for MY team (editable), opponentScores for opponents (read-only live)
let enteredScores  = {}; // { [playerId]: { [hole]: grossScore } }
let opponentScores = {}; // { [playerId]: { [hole]: grossScore } }

let _foursomeChannel = null;

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  const [pRes, tRes, rRes, parRes, fmtRes] = await Promise.all([
    sb.from('players').select('*').order('first_name'),
    sb.from('settings').select('*').eq('key','team_assignments'),
    sb.from('settings').select('*').in('key',['round_day1','round_day2','round_day3']),
    sb.from('settings').select('*').in('key',['pars_day1','pars_day2','pars_day3']),
    sb.from('settings').select('*').eq('key','round_formats'),
  ]);

  players = pRes.data || [];

  if (tRes.data?.[0]) try { teamAssignments = JSON.parse(tRes.data[0].value); } catch {}

  const roundStates = {};
  (rRes.data || []).forEach(r => { roundStates[r.key.replace('round_','')] = r.value; });
  currentRound = Object.entries(roundStates).find(([,v]) => v === 'open')?.[0] || null;

  const parOverrides = {};
  (parRes.data || []).forEach(r => { try { parOverrides[r.key.replace('pars_','')] = JSON.parse(r.value); } catch {} });
  coursePars = parOverrides[currentRound] || DEFAULT_PARS[currentRound] || DEFAULT_PARS.day2;

  if (fmtRes.data?.[0]) try { roundFormats = { ...DEFAULT_FORMATS, ...JSON.parse(fmtRes.data[0].value) }; } catch {}

  if (!currentRound) {
    document.getElementById('noRoundMsg').style.display = 'block';
    document.getElementById('setupForm').style.display = 'none';
    return;
  }

  // Populate scorer dropdown
  const scorerSel = document.getElementById('scorerSelect');
  players.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.first_name} ${p.last_name}`;
    scorerSel.appendChild(o);
  });

  // Restore saved scores
  const saved = localStorage.getItem(`bova_scores_${currentRound}`);
  if (saved) try { enteredScores = JSON.parse(saved); } catch {}
}

// ── SETUP DROPDOWNS ───────────────────────────────────────────────
document.getElementById('scorerSelect').addEventListener('change', refreshSetupLists);
document.getElementById('teamSelect').addEventListener('change', refreshSetupLists);
document.getElementById('opp1Select').addEventListener('change', refreshSetupLists);
document.getElementById('opp2Select').addEventListener('change', refreshSetupLists);

function refreshSetupLists() {
  const scorerId = document.getElementById('scorerSelect').value;
  const team     = document.getElementById('teamSelect').value;
  const opp1Id   = document.getElementById('opp1Select').value;
  const opp2Id   = document.getElementById('opp2Select').value;
  const oppTeam  = team === 'A' ? 'B' : 'A';

  // Teammate list: same team, not scorer
  const partnerSel = document.getElementById('partnerSelect');
  const prevPartner = partnerSel.value;
  partnerSel.innerHTML = '<option value="">Select teammate...</option>';
  if (team) {
    players
      .filter(p => teamAssignments[p.id] === team && p.id !== scorerId)
      .forEach(p => {
        const o = document.createElement('option');
        o.value = p.id;
        o.textContent = `${p.first_name} ${p.last_name}`;
        if (p.id === prevPartner) o.selected = true;
        partnerSel.appendChild(o);
      });
  }

  // Opponent lists: opposite team, not already selected
  const opp1Sel = document.getElementById('opp1Select');
  const opp2Sel = document.getElementById('opp2Select');
  const prevOpp1 = opp1Sel.value;
  const prevOpp2 = opp2Sel.value;

  opp1Sel.innerHTML = '<option value="">Select opponent...</option>';
  opp2Sel.innerHTML = '<option value="">Select opponent...</option>';

  // Determine opponent pool — if oppTeam has assigned players use those, else all others
  const oppPool = players.filter(p => {
    if (!team) return p.id !== scorerId;
    return teamAssignments[p.id] === oppTeam;
  });

  oppPool.forEach(p => {
    if (p.id === opp2Id) return; // skip if selected in opp2
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.first_name} ${p.last_name}`;
    if (p.id === prevOpp1) o.selected = true;
    opp1Sel.appendChild(o);
  });

  oppPool.forEach(p => {
    if (p.id === opp1Id) return; // skip if selected in opp1
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.first_name} ${p.last_name}`;
    if (p.id === prevOpp2) o.selected = true;
    opp2Sel.appendChild(o);
  });
}

// ── START SCORING ─────────────────────────────────────────────────
async function startScoring() {
  const scorerId  = document.getElementById('scorerSelect').value;
  const team      = document.getElementById('teamSelect').value;
  const partnerId = document.getElementById('partnerSelect').value;
  const opp1Id    = document.getElementById('opp1Select').value;
  const opp2Id    = document.getElementById('opp2Select').value;
  const err = document.getElementById('setupErr');

  if (!scorerId || !team || !partnerId) { err.classList.add('show'); return; }
  err.classList.remove('show');

  scorerPlayer  = players.find(p => p.id === scorerId);
  partnerPlayer = players.find(p => p.id === partnerId);
  opp1Player    = opp1Id ? players.find(p => p.id === opp1Id) : null;
  opp2Player    = opp2Id ? players.find(p => p.id === opp2Id) : null;
  scorerTeam    = team;

  if (!enteredScores[scorerId])  enteredScores[scorerId]  = {};
  if (!enteredScores[partnerId]) enteredScores[partnerId] = {};

  // Load existing opponent scores from DB
  await loadOpponentScores();

  // Also reload my team's scores from DB (in case entered elsewhere)
  await loadMyTeamScoresFromDb();

  // Subscribe to live opponent score changes
  subscribeToFoursome();

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('scorecardScreen').style.display = 'block';
  renderHole();
}

async function loadOpponentScores() {
  const oppIds = [opp1Player?.id, opp2Player?.id].filter(Boolean);
  if (!oppIds.length) return;
  const { data } = await sb.from('scores').select('*')
    .in('player_id', oppIds)
    .eq('round', currentRound);
  (data || []).forEach(s => {
    if (!opponentScores[s.player_id]) opponentScores[s.player_id] = {};
    opponentScores[s.player_id][s.hole] = s.gross_score;
  });
}

async function loadMyTeamScoresFromDb() {
  const myIds = [scorerPlayer?.id, partnerPlayer?.id].filter(Boolean);
  if (!myIds.length) return;
  const { data } = await sb.from('scores').select('*')
    .in('player_id', myIds)
    .eq('round', currentRound);
  (data || []).forEach(s => {
    if (!enteredScores[s.player_id]) enteredScores[s.player_id] = {};
    // Only fill in holes not already in localStorage
    if (!enteredScores[s.player_id][s.hole]) {
      enteredScores[s.player_id][s.hole] = s.gross_score;
    }
  });
  saveLocal();
}

// ── REALTIME OPPONENT SCORES ──────────────────────────────────────
function subscribeToFoursome() {
  if (_foursomeChannel) { sb.removeChannel(_foursomeChannel); }
  _foursomeChannel = sb.channel('foursome-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'scores' }, payload => {
      const s = (payload.eventType === 'DELETE') ? payload.old : payload.new;
      if (!s || s.round !== currentRound) return;
      const oppIds = [opp1Player?.id, opp2Player?.id].filter(Boolean);
      if (!oppIds.includes(s.player_id)) return;

      if (!opponentScores[s.player_id]) opponentScores[s.player_id] = {};
      if (payload.eventType === 'DELETE') {
        delete opponentScores[s.player_id][s.hole];
      } else {
        opponentScores[s.player_id][s.hole] = s.gross_score;
      }

      renderPlayers();
      renderSummary();

      // Flash the opponent score if it's for the current hole
      if (s.hole === currentHole) {
        const el = document.getElementById(`opp-box-${s.player_id}`);
        if (el) { el.classList.remove('score-flash'); void el.offsetWidth; el.classList.add('score-flash'); }
      }
    })
    .subscribe();
}

// ── FORMAT DETECTION (config-driven) ─────────────────────────────
function getHoleFormat(hole) {
  if (!currentRound) return 'stroke';
  const nine = hole <= 9 ? 'front' : 'back';
  return (roundFormats[currentRound] || DEFAULT_FORMATS[currentRound] || {})[nine] || 'stroke';
}
function isScrambleHole(hole)  { return getHoleFormat(hole) === 'scramble';  }
function isBestBallHole(hole)  { return getHoleFormat(hole) === 'best_ball'; }

const FORMAT_DISPLAY = {
  stroke:    'Stroke Play',
  scramble:  'Scramble',
  shamble:   'Shambles',
  best_ball: 'Best Ball',
};
function formatLabel(hole) { return FORMAT_DISPLAY[getHoleFormat(hole)] || 'Stroke Play'; }

// ── SCORE HELPERS ─────────────────────────────────────────────────
function scoreLabel(gross, par) {
  if (!gross) return '';
  const d = gross - par;
  if (d <= -2) return 'Eagle';
  if (d === -1) return 'Birdie';
  if (d === 0)  return 'Par';
  if (d === 1)  return 'Bogey';
  return 'Double+';
}
function scoreValClass(gross, par) {
  if (!gross) return 'empty';
  const d = gross - par;
  if (d <= -2) return 'eagle';
  if (d === -1) return 'birdie';
  if (d === 0)  return 'par';
  if (d === 1)  return 'bogey';
  return 'double';
}

// ── RENDER HOLE ───────────────────────────────────────────────────
function renderHole() {
  const par = coursePars[currentHole - 1] || 4;
  document.getElementById('holeNum').textContent = currentHole;
  document.getElementById('holePar').textContent = `Par ${par}`;
  document.getElementById('progressHoleLabel').textContent = `Hole ${currentHole} of 18`;
  document.getElementById('progressFill').style.width = `${((currentHole - 1) / 18) * 100}%`;
  document.getElementById('prevBtn').disabled = currentHole === 1;
  document.getElementById('nextBtn').textContent = currentHole === 18 ? 'Review' : 'Next →';
  document.getElementById('formatBadge').textContent = formatLabel(currentHole);

  renderPlayers();
  renderMiniStrip();
  renderProgress();
  renderSummary();
}

// ── RENDER PLAYERS (foursome grid) ────────────────────────────────
function renderPlayers() {
  const par        = coursePars[currentHole - 1] || 4;
  const isScramble = isScrambleHole(currentHole);
  const isBestBall = isBestBallHole(currentHole);

  const myTeamLabel  = scorerTeam === 'A' ? 'Team Bova' : 'The Challengers';
  const oppTeamLabel = scorerTeam === 'A' ? 'The Challengers' : 'Team Bova';
  const myColCls     = scorerTeam === 'A' ? 'team-a' : 'team-b';
  const oppColCls    = scorerTeam === 'A' ? 'team-b' : 'team-a';

  // ── LEFT COLUMN: My team (editable) ──
  let leftHtml = '';

  if (isScramble) {
    const gross = enteredScores[scorerPlayer.id]?.[currentHole] || null;
    const cls   = scoreValClass(gross, par);
    const lbl   = scoreLabel(gross, par);
    leftHtml = `
      <div class="scramble-label">Team Score</div>
      <div class="score-stepper">
        <button class="stepper-btn" ontouchstart="" onclick="adjustScore('${scorerPlayer.id}',${par},-1)">−</button>
        <div class="stepper-val ${cls}" id="val-${scorerPlayer.id}">${gross || '—'}</div>
        <button class="stepper-btn" ontouchstart="" onclick="adjustScore('${scorerPlayer.id}',${par},1)">+</button>
      </div>
      <div class="score-label ${cls}" id="lbl-${scorerPlayer.id}">${lbl}</div>`;
  } else {
    [scorerPlayer, partnerPlayer].forEach(player => {
      if (!player) return;
      const gross = enteredScores[player.id]?.[currentHole] || null;
      const cls   = scoreValClass(gross, par);
      const lbl   = scoreLabel(gross, par);
      leftHtml += `
        <div class="col-player">
          <div class="col-player-name">${player.first_name} ${player.last_name}</div>
          <div class="score-stepper">
            <button class="stepper-btn" ontouchstart="" onclick="adjustScore('${player.id}',${par},-1)">−</button>
            <div class="stepper-val ${cls}" id="val-${player.id}">${gross || '—'}</div>
            <button class="stepper-btn" ontouchstart="" onclick="adjustScore('${player.id}',${par},1)">+</button>
          </div>
          <div class="score-label ${cls}" id="lbl-${player.id}">${lbl}</div>
        </div>`;
    });
    if (isBestBall) {
      leftHtml += `<div class="best-ball-note" id="bestBallNote">${getMyBestBallNote(par)}</div>`;
    }
  }

  // ── RIGHT COLUMN: Opponents (read-only live) ──
  let rightHtml = '';
  const hasOpps = opp1Player || opp2Player;

  if (!hasOpps) {
    rightHtml = `<div style="padding:1rem 0;font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(240,230,204,0.15);">No opponents<br>selected</div>`;
  } else if (isScramble) {
    // Opposing team has one scramble score; read from either opp player
    const refOpp = opp1Player || opp2Player;
    const gross  = opponentScores[refOpp.id]?.[currentHole] || null;
    const cls    = scoreValClass(gross, par);
    const lbl    = scoreLabel(gross, par);
    rightHtml = `
      <div class="scramble-label">Team Score</div>
      <div class="scramble-opp-box" id="opp-box-${refOpp.id}">
        ${gross
          ? `<div class="opp-score-box" style="justify-content:center;">
               <div class="opp-num ${cls}">${gross}</div>
               <div class="opp-rel ${cls}">${lbl}</div>
             </div>`
          : `<div class="opp-waiting">Waiting...</div>`
        }
      </div>`;
  } else {
    [opp1Player, opp2Player].forEach(opp => {
      if (!opp) return;
      const gross = opponentScores[opp.id]?.[currentHole] || null;
      const cls   = scoreValClass(gross, par);
      const lbl   = scoreLabel(gross, par);
      rightHtml += `
        <div class="col-player">
          <div class="col-player-name">${opp.first_name} ${opp.last_name}</div>
          <div id="opp-box-${opp.id}">
            ${gross
              ? `<div class="opp-score-box">
                   <div class="opp-num ${cls}">${gross}</div>
                   <div><div class="opp-rel ${cls}">${lbl}</div></div>
                 </div>`
              : `<div class="opp-waiting">Waiting...</div>`
            }
          </div>
        </div>`;
    });
    if (isBestBall) {
      rightHtml += `<div class="best-ball-note" id="oppBestBallNote">${getOppBestBallNote(par)}</div>`;
    }
  }

  const html = `<div class="foursome-cols">
    <div class="foursome-col">
      <div class="col-header ${myColCls}">
        ${myTeamLabel}
      </div>
      ${leftHtml}
    </div>
    <div class="foursome-col">
      <div class="col-header ${oppColCls}">
        ${oppTeamLabel}${hasOpps ? `<span class="col-live-dot"></span>` : ''}
      </div>
      ${rightHtml}
    </div>
  </div>`;

  document.getElementById('foursomeGrid').innerHTML = html;
}

function getMyBestBallNote(par) {
  const s = enteredScores[scorerPlayer.id]?.[currentHole];
  const p = enteredScores[partnerPlayer?.id]?.[currentHole];
  if (!s && !p) return '';
  if (s && p) {
    const lower = Math.min(s, p);
    const who = lower === s ? scorerPlayer.first_name : partnerPlayer.first_name;
    return `Counting: <strong style="color:var(--gold)">${lower}</strong> (${who})`;
  }
  if (s) return `Counting: <strong style="color:var(--gold)">${s}</strong> (${scorerPlayer.first_name})`;
  return `Counting: <strong style="color:var(--gold)">${p}</strong> (${partnerPlayer.first_name})`;
}

function getOppBestBallNote(par) {
  const s1 = opp1Player ? opponentScores[opp1Player.id]?.[currentHole] : null;
  const s2 = opp2Player ? opponentScores[opp2Player.id]?.[currentHole] : null;
  if (!s1 && !s2) return '';
  if (s1 && s2) {
    const lower = Math.min(s1, s2);
    const who = lower === s1 ? opp1Player.first_name : opp2Player.first_name;
    return `Counting: <strong style="color:#6a8aaa">${lower}</strong> (${who})`;
  }
  if (s1) return `Counting: <strong style="color:#6a8aaa">${s1}</strong> (${opp1Player.first_name})`;
  return `Counting: <strong style="color:#6a8aaa">${s2}</strong> (${opp2Player.first_name})`;
}

// ── SCORE ADJUSTMENT ──────────────────────────────────────────────
function adjustScore(playerId, par, delta) {
  if (!enteredScores[playerId]) enteredScores[playerId] = {};
  const current = enteredScores[playerId][currentHole] || par;
  const next = Math.max(1, Math.min(12, current + delta));
  enteredScores[playerId][currentHole] = next;

  // Day 2 scramble: mirror score to partner
  if (isScrambleHole(currentHole) && playerId === scorerPlayer.id && partnerPlayer) {
    if (!enteredScores[partnerPlayer.id]) enteredScores[partnerPlayer.id] = {};
    enteredScores[partnerPlayer.id][currentHole] = next;
    autoSaveToDb(partnerPlayer.id, currentHole, next);
  }

  // Update DOM inline
  const cls = scoreValClass(next, par);
  const lbl = scoreLabel(next, par);
  const valEl = document.getElementById(`val-${playerId}`);
  const lblEl = document.getElementById(`lbl-${playerId}`);
  if (valEl) { valEl.textContent = next; valEl.className = `stepper-val ${cls}`; }
  if (lblEl) { lblEl.textContent = lbl;  lblEl.className = `score-label ${cls}`; }

  // Update best ball note
  if (isBestBallHole(currentHole)) {
    const noteEl = document.getElementById('bestBallNote');
    if (noteEl) noteEl.innerHTML = getMyBestBallNote(par);
  }

  saveLocal();
  renderMiniStrip();
  renderProgress();
  renderSummary();
  autoSaveToDb(playerId, currentHole, next);
}

function prevHole() { if (currentHole > 1)  { currentHole--; renderHole(); } }
function nextHole() { if (currentHole < 18) { currentHole++; renderHole(); } else { renderHole(); } }

// ── MINI STRIP ────────────────────────────────────────────────────
function renderMiniStrip() {
  let html = '';
  for (let h = 1; h <= 18; h++) {
    const par   = coursePars[h-1] || 4;
    const gross = enteredScores[scorerPlayer?.id]?.[h];
    const cls = gross ? (() => {
      const d = gross - par;
      if (d <= -2) return 'ms-eagle';
      if (d === -1) return 'ms-birdie';
      if (d === 0)  return 'ms-par';
      if (d === 1)  return 'ms-bogey';
      return 'ms-double';
    })() : 'ms-empty';
    const cur = h === currentHole ? 'ms-current' : '';
    html += `<div class="mini-hole" onclick="currentHole=${h};renderHole()">
      <div class="mini-num">${h}</div>
      <div class="mini-score ${cls} ${cur}">${gross || ''}</div>
    </div>`;
  }
  document.getElementById('miniStrip').innerHTML = html;
  const strip = document.getElementById('miniStrip');
  const chipW = 28;
  strip.scrollLeft = (currentHole - 1) * chipW - strip.clientWidth / 2 + chipW / 2;
}

// ── PROGRESS ──────────────────────────────────────────────────────
function renderProgress() {
  if (!scorerPlayer) return;
  let totalRel = 0, thru = 0;
  for (let h = 1; h <= 18; h++) {
    const g = enteredScores[scorerPlayer.id]?.[h];
    if (g) { totalRel += g - (coursePars[h-1] || 4); thru++; }
  }
  const el = document.getElementById('progressToPar');
  el.textContent = thru === 0 ? 'E' : totalRel === 0 ? 'E' : totalRel > 0 ? `+${totalRel}` : `${totalRel}`;
  el.className = `progress-toPar ${totalRel < 0 ? 'under' : totalRel > 0 ? 'over' : 'even'}`;
}

// ── SUMMARY ───────────────────────────────────────────────────────
function renderSummary() {
  let html = '';

  // My team
  [scorerPlayer, partnerPlayer].forEach(p => {
    if (!p) return;
    let total = 0, par = 0, thru = 0;
    for (let h = 1; h <= 18; h++) {
      const g = enteredScores[p.id]?.[h];
      if (g) { total += g; par += coursePars[h-1] || 4; thru++; }
    }
    const rel = total - par;
    const cls = rel < 0 ? 'under' : rel > 0 ? 'over' : 'even';
    const relStr = thru === 0 ? '—' : rel === 0 ? 'E' : rel > 0 ? `+${rel}` : `${rel}`;
    html += `<div class="summary-row">
      <span>${p.first_name} ${p.last_name}${thru > 0 ? ` <span style="color:rgba(240,230,204,0.3);font-size:0.72rem">(${thru === 18 ? 'F' : thru})</span>` : ''}</span>
      <span class="summary-score ${cls}">${relStr}</span>
    </div>`;
  });

  // Opponents
  const hasOpps = opp1Player || opp2Player;
  if (hasOpps) {
    html += `<div class="summary-divider"></div>`;
    [opp1Player, opp2Player].forEach(opp => {
      if (!opp) return;
      let total = 0, par = 0, thru = 0;
      for (let h = 1; h <= 18; h++) {
        const g = opponentScores[opp.id]?.[h];
        if (g) { total += g; par += coursePars[h-1] || 4; thru++; }
      }
      const rel = total - par;
      const cls = rel < 0 ? 'under' : rel > 0 ? 'over' : 'even';
      const relStr = thru === 0 ? '—' : rel === 0 ? 'E' : rel > 0 ? `+${rel}` : `${rel}`;
      html += `<div class="summary-row">
        <span class="summary-name-opp">${opp.first_name} ${opp.last_name}${thru > 0 ? ` <span style="color:rgba(240,230,204,0.2);font-size:0.72rem">(${thru === 18 ? 'F' : thru})</span>` : ''}</span>
        <span class="summary-score ${cls}" style="opacity:0.75">${relStr}</span>
      </div>`;
    });
  }

  document.getElementById('summaryRows').innerHTML = html;
}

// ── PERSISTENCE ───────────────────────────────────────────────────
function saveLocal() {
  localStorage.setItem(`bova_scores_${currentRound}`, JSON.stringify(enteredScores));
}

let _saveTimer = {};
async function autoSaveToDb(playerId, hole, gross) {
  const key = `${playerId}_${hole}`;
  clearTimeout(_saveTimer[key]);
  _saveTimer[key] = setTimeout(async () => {
    const saving = document.getElementById('savingIndicator');
    saving.classList.add('show');
    try {
      await sb.from('scores').upsert({
        player_id: playerId,
        round: currentRound,
        hole: hole,
        gross_score: gross,
      }, { onConflict: 'player_id,round,hole' });
    } catch {}
    setTimeout(() => saving.classList.remove('show'), 800);
  }, 600);
}

// ── SUBMIT ────────────────────────────────────────────────────────
async function submitRound() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const both = [scorerPlayer, partnerPlayer].filter(Boolean);
  const upserts = [];
  both.forEach(p => {
    Object.entries(enteredScores[p.id] || {}).forEach(([hole, gross]) => {
      if (gross != null) upserts.push({ player_id: p.id, round: currentRound, hole: parseInt(hole), gross_score: gross });
    });
  });

  if (upserts.length) {
    try { await sb.from('scores').upsert(upserts, { onConflict: 'player_id,round,hole' }); }
    catch {}
  }

  showToast('Scores submitted.');
  setTimeout(() => { window.location.href = '/scoreboard'; }, 1800);
}

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg) {
  let el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;padding:0.9rem 1.4rem;font-family:"Barlow Condensed",sans-serif;font-size:0.78rem;letter-spacing:0.1em;color:#f0e6cc;border-left:3px solid #c09030;background:#0a0802;box-shadow:0 8px 32px rgba(0,0,0,0.5);transform:translateX(120%);opacity:0;transition:all 0.35s cubic-bezier(0.34,1.2,0.64,1);max-width:280px;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.transform = 'translateX(0)'; el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.transform = 'translateX(120%)'; el.style.opacity = '0'; }, 3800);
}

init();
</script>
</body>
</html>
