<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOURney — All Combinations</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c09030;--ink:#1a1008;--bg:#f5ede0;--card:#ede2d2;--dark:#0f0a04;--muted:#7a6a54;--border:rgba(192,144,48,0.22);--red:#b43c28}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
/* Header */
.hdr{background:var(--dark);padding:1rem 1.25rem 0.9rem;border-bottom:1px solid rgba(192,144,48,0.18);position:sticky;top:0;z-index:10}
.hdr-top{display:flex;align-items:baseline;gap:0.75rem;margin-bottom:0.65rem}
h1{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold)}
.count-badge{font-family:monospace;font-size:0.62rem;padding:0.15em 0.55em;border-radius:3px;background:rgba(192,144,48,0.15);color:var(--gold);border:1px solid rgba(192,144,48,0.3)}
/* Filter groups */
.filters{display:flex;flex-direction:column;gap:0.4rem}
.filter-row{display:flex;align-items:center;gap:0.35rem;flex-wrap:wrap}
.filter-label{font-size:0.52rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(192,144,48,0.5);width:4rem;flex-shrink:0}
.chip{font-family:monospace;font-size:0.68rem;padding:0.18rem 0.55rem;border-radius:3px;background:rgba(255,255,255,0.04);color:rgba(240,230,204,0.5);border:1px solid rgba(192,144,48,0.15);cursor:pointer;transition:all .12s;white-space:nowrap;user-select:none}
.chip:hover{color:rgba(240,230,204,0.8);border-color:rgba(192,144,48,0.35)}
.chip.on{background:rgba(192,144,48,0.18);color:var(--gold);border-color:var(--gold)}
/* Table */
.tbl-wrap{overflow-x:auto;padding:0 0 2rem}
table{width:100%;border-collapse:collapse;min-width:520px}
thead th{font-size:0.52rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);padding:0.75rem 0.85rem 0.5rem;text-align:left;border-bottom:1px solid var(--border);background:rgba(192,144,48,0.04);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:rgba(192,144,48,0.04)}
tbody tr.group-start td{border-top:2px solid rgba(192,144,48,0.18)}
td{padding:0.52rem 0.85rem;font-size:0.8rem;vertical-align:middle}
td.days{font-family:monospace;font-weight:700;color:var(--gold);font-size:0.85rem;width:3.5rem}
td.structure{font-weight:600;font-size:0.8rem}
td.players{font-family:monospace;color:var(--muted);width:4rem}
td.formats{font-size:0.72rem;color:var(--muted);max-width:160px}
td.tier{width:7rem}
td.cta{width:4.5rem;text-align:right}
.tier-pill{display:inline-flex;align-items:center;font-family:monospace;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.2em 0.55em;border-radius:3px;white-space:nowrap}
.tier-round{background:rgba(42,122,32,0.12);color:#2a7a20;border:1px solid rgba(42,122,32,0.3)}
.tier-weekend{background:rgba(192,144,48,0.12);color:var(--gold);border:1px solid rgba(192,144,48,0.3)}
.tier-invitational{background:rgba(74,48,128,0.12);color:#6a48b8;border:1px solid rgba(74,48,128,0.25)}
.tier-enterprise{background:rgba(180,60,40,0.1);color:var(--red);border:1px solid rgba(180,60,40,0.25)}
.create-btn{font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.25rem 0.65rem;border-radius:3px;background:rgba(192,144,48,0.12);color:var(--gold);border:1px solid rgba(192,144,48,0.3);text-decoration:none;white-space:nowrap;transition:all .12s}
.create-btn:hover{background:rgba(192,144,48,0.25);border-color:var(--gold)}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:0.82rem}
/* Structure badge colors */
.s-individual{color:var(--muted)}
.s-pairs{color:#6a48b8}
.s-team{color:var(--gold)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>TOURney Combinations</h1>
    <span class="count-badge" id="countBadge">—</span>
  </div>
  <div class="filters">
    <div class="filter-row">
      <span class="filter-label">Days</span>
      <span class="chip on" data-group="days" data-val="all">All</span>
      <span class="chip" data-group="days" data-val="1">1</span>
      <span class="chip" data-group="days" data-val="2">2</span>
      <span class="chip" data-group="days" data-val="3">3</span>
      <span class="chip" data-group="days" data-val="4">4</span>
      <span class="chip" data-group="days" data-val="5">5</span>
      <span class="chip" data-group="days" data-val="6">6</span>
      <span class="chip" data-group="days" data-val="7">7</span>
    </div>
    <div class="filter-row">
      <span class="filter-label">Structure</span>
      <span class="chip on" data-group="structure" data-val="all">All</span>
      <span class="chip" data-group="structure" data-val="individual">Individual</span>
      <span class="chip" data-group="structure" data-val="pairs">Pairs</span>
      <span class="chip" data-group="structure" data-val="2">2 Teams</span>
      <span class="chip" data-group="structure" data-val="3">3 Teams</span>
      <span class="chip" data-group="structure" data-val="4">4 Teams</span>
      <span class="chip" data-group="structure" data-val="5">5 Teams</span>
      <span class="chip" data-group="structure" data-val="6">6 Teams</span>
      <span class="chip" data-group="structure" data-val="8">8 Teams</span>
    </div>
    <div class="filter-row">
      <span class="filter-label">Players</span>
      <span class="chip on" data-group="players" data-val="all">All</span>
      <span class="chip" data-group="players" data-val="8">8</span>
      <span class="chip" data-group="players" data-val="12">12</span>
      <span class="chip" data-group="players" data-val="16">16</span>
      <span class="chip" data-group="players" data-val="20">20</span>
      <span class="chip" data-group="players" data-val="24">24</span>
      <span class="chip" data-group="players" data-val="32">32</span>
      <span class="chip" data-group="players" data-val="40">40</span>
      <span class="chip" data-group="players" data-val="48">48</span>
    </div>
    <div class="filter-row">
      <span class="filter-label">Tier</span>
      <span class="chip on" data-group="tier" data-val="all">All</span>
      <span class="chip" data-group="tier" data-val="Round">Round</span>
      <span class="chip" data-group="tier" data-val="Weekend">Weekend</span>
      <span class="chip" data-group="tier" data-val="Invitational">Invitational</span>
      <span class="chip" data-group="tier" data-val="Enterprise">Enterprise</span>
    </div>
  </div>
</div>

<div class="tbl-wrap">
  <table id="comboTable">
    <thead>
      <tr>
        <th>Days</th>
        <th>Structure</th>
        <th>Players</th>
        <th>Tier</th>
        <th>$/yr</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none">No combinations match your filters.</div>
</div>

<script>
const DAYS    = [1,2,3,4,5,6,7];
const STRUCTS = [
  { val:'individual', label:'Individual',    cls:'s-individual', teamCount:1 },
  { val:'pairs',      label:'Pairs',         cls:'s-pairs',      teamCount:null },
  { val:'2',          label:'2 Teams',       cls:'s-team',       teamCount:2 },
  { val:'3',          label:'3 Teams',       cls:'s-team',       teamCount:3 },
  { val:'4',          label:'4 Teams',       cls:'s-team',       teamCount:4 },
  { val:'5',          label:'5 Teams',       cls:'s-team',       teamCount:5 },
  { val:'6',          label:'6 Teams',       cls:'s-team',       teamCount:6 },
  { val:'8',          label:'8 Teams',       cls:'s-team',       teamCount:8 },
];
const PLAYERS = [8,12,16,20,24,32,40,48];
const FORMATS = ['Stroke','Scramble','Best Ball','Shambles','Stableford','Match','Alt Shot','Chapman','Skins','Greensomes','Mod Stableford','Nassau'];

function calcTier(players, days) {
  if (days === 1)                    return { name:'Round',        price:9,    cls:'tier-round' };
  if (days <= 3 && players <= 24)    return { name:'Weekend',      price:19,   cls:'tier-weekend' };
  if (days <= 7 && players <= 36)    return { name:'Invitational', price:35,   cls:'tier-invitational' };
  return                                    { name:'Enterprise',   price:null, cls:'tier-enterprise' };
}

function createLink(days, structure, players) {
  const params = new URLSearchParams({ days, players });
  if (structure === 'individual') params.set('teamCount', '1');
  else if (structure === 'pairs') { params.set('teamCount', '1'); params.set('structure', 'pairs'); }
  else params.set('teamCount', structure);
  return '/create?' + params.toString();
}

// Build all combos
const ALL = [];
for (const d of DAYS) {
  for (const s of STRUCTS) {
    for (const p of PLAYERS) {
      ALL.push({ days: d, structure: s, players: p, tier: calcTier(p, d) });
    }
  }
}

// State
const active = { days:'all', structure:'all', players:'all', tier:'all' };

function filtered() {
  return ALL.filter(c => {
    if (active.days !== 'all' && c.days !== parseInt(active.days)) return false;
    if (active.structure !== 'all' && c.structure.val !== active.structure) return false;
    if (active.players !== 'all' && c.players !== parseInt(active.players)) return false;
    if (active.tier !== 'all' && c.tier.name !== active.tier) return false;
    return true;
  });
}

function render() {
  const rows = filtered();
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyMsg');
  document.getElementById('countBadge').textContent = rows.length + ' of ' + ALL.length;

  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  let html = '';
  let lastDay = null;
  rows.forEach(c => {
    const isGroupStart = c.days !== lastDay;
    lastDay = c.days;
    const price = c.tier.price ? '$' + c.tier.price : 'Custom';
    html += `<tr${isGroupStart ? ' class="group-start"' : ''}>
      <td class="days">${isGroupStart ? c.days : ''}</td>
      <td class="structure"><span class="${c.structure.cls}">${c.structure.label}</span></td>
      <td class="players">${c.players}</td>
      <td class="tier"><span class="tier-pill ${c.tier.cls}">${c.tier.name}</span></td>
      <td style="font-family:monospace;font-size:0.78rem;color:var(--muted)">${price}</td>
      <td class="cta"><a class="create-btn" href="${createLink(c.days, c.structure.val, c.players)}">Create →</a></td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

// Filter chips
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const group = chip.dataset.group;
    const val   = chip.dataset.val;
    document.querySelectorAll(`.chip[data-group="${group}"]`).forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    active[group] = val;
    render();
  });
});

render();
</script>
<script src="/bug-fab.js" defer></script>
</body>
</html>
