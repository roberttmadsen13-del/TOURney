<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/lib/util.js"></script>
<link rel="icon" href="/icon-192.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5ede0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOURney">
<title>Player Directory — TOURney</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1008;--gold:#c09030;--gold-l:#d4aa50;--gold-p:#e8cc80;--cream:#f0e6cc;--red:#8a1e10;--border:rgba(192,144,48,0.28);--bg:#f5ede0;--card:#fdf8f0;--muted:rgba(26,16,8,0.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;}
a{color:inherit;text-decoration:none;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(14,11,6,0.97);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:0.45rem;}
.nav-logo em{font-style:italic;color:var(--gold);}
.nav-links{display:flex;gap:1.2rem;align-items:center;}
.nav-links a{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(240,230,204,0.4);}
.nav-links a:hover{color:var(--gold);}
@media(max-width:520px){.nav{padding:0 1rem;}.nav-links a:not(:last-child){display:none;}}

/* PAGE HEADER */
.page-header{max-width:1000px;margin:0 auto;padding:2.5rem 2rem 1.5rem;border-bottom:1px solid var(--border);}
.page-eyebrow{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(192,144,48,0.5);margin-bottom:0.5rem;}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;line-height:1;margin-bottom:0.3rem;}
.page-title em{font-style:italic;color:var(--gold);}
.page-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);}

/* MAIN */
.main{max-width:1000px;margin:0 auto;padding:2rem;}
@media(max-width:520px){.main{padding:1.5rem 1rem;}}

/* TEAM SECTIONS */
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);}
@media(max-width:700px){.teams-grid{grid-template-columns:1fr;}}

.team-section{background:var(--card);padding:1.5rem;}
.team-header{padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid var(--border);}
.team-eyebrow{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:0.4rem;}
.team-eyebrow.team-a{color:var(--gold);}
.team-eyebrow.team-b{color:#4a6a8a;}
.team-name{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;line-height:1;}
.team-name em{font-style:italic;color:var(--gold);}
.team-captain{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-top:0.3rem;}
.team-count{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-top:0.2rem;}

/* PLAYER CARDS */
.player-list{display:flex;flex-direction:column;gap:1px;}
.player-card{padding:0.85rem 0;border-bottom:1px solid rgba(26,16,8,0.08);display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;}
.player-card:last-child{border-bottom:none;}
.player-info{flex:1;min-width:0;}
.player-name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:0.2rem;}
.player-email{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.08em;color:var(--muted);word-break:break-all;}
.player-email a{color:inherit;text-decoration:none;}
.player-email a:hover{color:var(--gold);}
.tier-pill{display:inline-block;padding:0.12rem 0.5rem;border:1px solid;font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.1em;text-transform:uppercase;flex-shrink:0;align-self:flex-start;margin-top:2px;}
.t-scratch{color:var(--gold);border-color:var(--gold);}
.t-eagle{color:#2a6a28;border-color:#2a6a28;}
.t-birdie{color:#2a4a7a;border-color:#2a4a7a;}
.t-bogey{color:#7a4a20;border-color:#7a4a20;}
.t-pretender{color:#5a2a6a;border-color:#5a2a6a;}
.t-hacker{color:rgba(26,16,8,0.4);border-color:rgba(26,16,8,0.25);}

/* UNASSIGNED SECTION */
.unassigned-section{margin-top:2rem;padding-top:2rem;border-top:1px solid var(--border);}
.unassigned-title{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
.unassigned-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border);}
.unassigned-card{background:var(--card);padding:0.85rem 1rem;}
.unassigned-name{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;color:var(--ink);margin-bottom:0.2rem;}
.unassigned-email{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.08em;color:var(--muted);}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:4rem 2rem;font-family:'Playfair Display',serif;font-style:italic;color:var(--muted);}
.empty-state strong{display:block;font-size:1.1rem;margin-bottom:0.5rem;font-style:normal;color:var(--ink);}
.loading{text-align:center;padding:3rem;font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);}

/* STATS BAR */
.stats-bar{display:flex;gap:0;border:1px solid var(--border);margin-bottom:2rem;}
.stat-item{flex:1;padding:1rem 1.2rem;border-right:1px solid var(--border);background:var(--card);}
.stat-item:last-child{border-right:none;}
.stat-val{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;color:var(--gold);line-height:1;}
.stat-label{font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-top:0.2rem;}
@media(max-width:400px){.stats-bar{flex-wrap:wrap;}.stat-item{flex:1 1 50%;border-bottom:1px solid var(--border);}}
</style>
<link rel="stylesheet" href="/nav-mobile.css">
<script defer src="/nav-mobile.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><img id="navLogoImg" style="display:none;height:32px;max-width:120px;object-fit:contain;object-position:left"><svg id="navLogoSvg" width="14" height="18" viewBox="0 0 14 18" style="flex-shrink:0;display:block" fill="none"><line x1="2" y1="1" x2="2" y2="17" stroke="#c09030" stroke-width="1.5" stroke-linecap="round"/><path d="M2 2L12 5.5L2 9.5Z" fill="#c09030"/></svg>The Bova <em>Invitational</em></div>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/scoreboard">Leaderboard</a>
    <a href="/feed">Feed</a>
    <a href="/directory">Directory</a>
    <a href="/profile">Profile</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow">Myrtle Beach, SC &middot; 2026</div>
  <div class="page-title">Player <em>Directory</em></div>
  <div class="page-sub">The Field &middot; Team Rosters &middot; Contact Info</div>
</div>

<div class="main">
  <div id="loadingState" class="loading">Loading field...</div>
  <div id="directoryContent" style="display:none;">

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-val" id="statTotal">—</div><div class="stat-label">Players</div></div>
      <div class="stat-item"><div class="stat-val" id="statTeamA">—</div><div class="stat-label" id="statLabelA">Team A</div></div>
      <div class="stat-item"><div class="stat-val" id="statTeamB">—</div><div class="stat-label" id="statLabelB">Team B</div></div>
      <div class="stat-item"><div class="stat-val" id="statUnassigned">—</div><div class="stat-label">Unassigned</div></div>
    </div>

    <!-- TEAM ROSTERS -->
    <div class="teams-grid" id="teamsGrid"></div>

    <!-- UNASSIGNED -->
    <div class="unassigned-section" id="unassignedSection" style="display:none;">
      <div class="unassigned-title">Registered — Team TBD</div>
      <div class="unassigned-grid" id="unassignedGrid"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.min.js" integrity="sha384-iWpUQPQzWsFiosLgsS8o+e6E8y3Gm+EW2m/vAAo7A2H3fuc4KOKEx+5CAord2H2z" crossorigin="anonymous"></script>
<script src="/tourney-init.js"></script>
<script>
const sb = window.tourney.db;

function formatPhone(raw) {
  if (!raw) return '';
  const d = raw.replace(/\D/g, '');
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  return raw;
}

const TIER_MAP    = {scratch:'t-scratch',eagle:'t-eagle',birdie:'t-birdie',bogey:'t-bogey',pretender:'t-pretender',hacker:'t-hacker'};
const TIER_LABELS = {scratch:'Scratch',eagle:'Eagle',birdie:'Birdie',bogey:'Bogey',pretender:'Pretenders',hacker:'Dreamers'};
const TIER_ORDER  = ['scratch','eagle','birdie','bogey','pretender','hacker'];

function formatPhone(raw) {
  if (!raw) return '';
  const digits = raw.replace(/\D/g, '');
  if (digits.length === 10) return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
  if (digits.length === 11 && digits[0] === '1') return `(${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7)}`;
  return raw;
}

async function init() {
  const { tournament } = await window.tourney.ready;
  const [pRes, tRes, capRes, namesRes] = await Promise.all([
    sb.from('players').select('*').eq('tournament_id', tournament.id).order('last_name'),
    sb.from('settings').select('*').eq('tournament_id', tournament.id).eq('key','team_assignments'),
    sb.from('settings').select('value').eq('tournament_id', tournament.id).eq('key','challengers_captain'),
    sb.from('settings').select('key,value').eq('tournament_id', tournament.id).in('key',['team_a_name','team_b_name','team_a_captain']),
  ]);

  const players = pRes.data || [];
  let teamAssignments = {};
  if (tRes.data?.[0]) try { teamAssignments = JSON.parse(tRes.data[0].value); } catch {}
  const challengersCaptain = capRes.data?.[0]?.value || 'TBD';
  const nm = {};
  (namesRes.data || []).forEach(r => { nm[r.key] = r.value; });
  const teamAName = nm.team_a_name || 'Team A';
  const teamBName = nm.team_b_name || 'Team B';
  const teamACaptain = nm.team_a_captain || 'TBD';

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('directoryContent').style.display = 'block';

  const teamA = players.filter(p => teamAssignments[p.id] === 'A').sort(byTier);
  const teamB = players.filter(p => teamAssignments[p.id] === 'B').sort(byTier);
  const unassigned = players.filter(p => !teamAssignments[p.id]);

  // Stats
  document.getElementById('statTotal').textContent = players.length;
  document.getElementById('statTeamA').textContent = teamA.length;
  document.getElementById('statTeamB').textContent = teamB.length;
  document.getElementById('statUnassigned').textContent = unassigned.length;
  const lA = document.getElementById('statLabelA'); if (lA) lA.textContent = teamAName;
  const lB = document.getElementById('statLabelB'); if (lB) lB.textContent = teamBName;

  // Teams grid
  const teamsHtml = `
    ${renderTeamSection('A', teamAName, teamACaptain, teamA)}
    ${renderTeamSection('B', teamBName, challengersCaptain, teamB)}
  `;
  document.getElementById('teamsGrid').innerHTML = teamsHtml;

  // Unassigned
  if (unassigned.length) {
    document.getElementById('unassignedSection').style.display = 'block';
    document.getElementById('unassignedGrid').innerHTML = unassigned.map(p => `
      <div class="unassigned-card">
        <div class="unassigned-name">${esc(p.first_name)} ${esc(p.last_name)}</div>
        <div class="unassigned-email">${esc(p.email)}</div>
      </div>`).join('');
  }

  if (!teamA.length && !teamB.length && !unassigned.length) {
    document.getElementById('teamsGrid').innerHTML = `
      <div style="grid-column:1/-1;" class="empty-state">
        <strong>No Players Yet</strong>
        The field will appear here once players register.
      </div>`;
  }
}

function byTier(a, b) {
  return TIER_ORDER.indexOf(a.handicap) - TIER_ORDER.indexOf(b.handicap);
}

function renderTeamSection(team, name, captain, players) {
  const isA = team === 'A';
  const eyebrowCls = isA ? 'team-a' : 'team-b';
  const nameParts = name.split(' ');
  // Italicize the last word
  const nameHtml = nameParts.length > 1
    ? `${nameParts.slice(0,-1).join(' ')} <em>${nameParts[nameParts.length-1]}</em>`
    : `<em>${name}</em>`;

  const playerRows = players.length
    ? players.map(p => `
        <div class="player-card">
          <div class="player-info">
            <div class="player-name">${esc(p.first_name)} ${esc(p.last_name)}</div>
            <div class="player-email"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>
            ${p.phone_number ? `<div class="player-email"><a href="tel:${esc(p.phone_number)}">${formatPhone(p.phone_number)}</a></div>` : ''}
          </div>
          <span class="tier-pill ${TIER_MAP[p.handicap]||''}">${TIER_LABELS[p.handicap]||esc(p.handicap)||'—'}</span>
        </div>`).join('')
    : `<div style="padding:1.5rem 0;font-family:'Playfair Display',serif;font-style:italic;color:rgba(240,230,204,0.2);font-size:0.9rem;">No players assigned yet.</div>`;

  return `<div class="team-section">
    <div class="team-header">
      <div class="team-eyebrow ${eyebrowCls}">${isA ? 'Team One' : 'Team Two'}</div>
      <div class="team-name">${nameHtml}</div>
      <div class="team-captain">Captain — ${esc(captain)}</div>
      <div class="team-count">${players.length} player${players.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="player-list">${playerRows}</div>
  </div>`;
}

async function loadNavLogo() {
  const { tournament } = await window.tourney.ready;
  const { data } = await sb.from('settings').select('value').eq('tournament_id', tournament.id).eq('key','logo_url').maybeSingle();
  if (data?.value) {
    const img = document.getElementById('navLogoImg');
    const svg = document.getElementById('navLogoSvg');
    if (img) { img.src = data.value; img.style.display = 'block'; }
    if (svg) svg.style.display = 'none';
  }
}

init();
loadNavLogo();
// Admin link in desktop nav
(async () => {
  const { data: sess } = await sb.auth.getSession();
  const email = sess?.session?.user?.email;
  if (!email) return;
  const { tournament } = await window.tourney.ready;
  const _adminHref = location.pathname.match(/\/t\/([^/?#]+)/) ? `/t/${tournament.slug}/admin` : '/admin';
  const { data: ac } = await sb.from('tournament_admins').select('id').eq('tournament_id', tournament.id).eq('email', email.toLowerCase()).maybeSingle();
  if (ac) {
    const nl = document.querySelector('.nav-links');
    if (nl) { const a = document.createElement('a'); a.href = _adminHref; a.textContent = 'Admin'; nl.appendChild(a); }
  }
})();
</script>
<script src="/pwa.js"></script>
<script src="/bug-fab.js?v=3" defer></script>
</body>
</html>
