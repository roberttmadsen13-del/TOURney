name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ESLint
        run: npm install --no-save eslint
      - name: Run ESLint
        run: npx eslint "*.js" --no-eslintrc --rule '{"no-undef": "warn", "no-unused-vars": "warn"}' || true

  type-check-functions:
    name: Deno type-check edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check "$f"
          done
