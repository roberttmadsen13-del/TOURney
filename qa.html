<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOURney — QA Hub</title>
<style>
  :root {
    --gold:#c09030;--gold-light:#d4a840;--gold-dim:rgba(192,144,48,0.18);
    --bg:#0d0a05;--surface:#151009;--card:#1c140a;--card2:#221a0e;
    --border:rgba(192,144,48,0.22);--muted:#7a6a54;--text:#e8dcc8;
    --red:#c0392b;--green:#27ae60;--blue:#2980b9;--orange:#e67e22;--purple:#8e44ad;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}

  /* ── Nav ── */
  nav{position:sticky;top:0;z-index:100;background:rgba(13,10,5,0.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);padding:0.6rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .nav-brand{color:var(--gold);font-weight:700;font-size:1rem;letter-spacing:0.05em;white-space:nowrap}
  .nav-brand span{color:var(--muted);font-weight:400;font-size:0.8rem;margin-left:0.4rem}
  .nav-links{display:flex;gap:0.2rem;flex-wrap:wrap;margin-left:auto}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:0.78rem;padding:0.3rem 0.55rem;border-radius:4px;transition:all 0.15s;white-space:nowrap}
  .nav-links a:hover{color:var(--gold);background:var(--gold-dim)}

  /* ── Hero ── */
  .hero{padding:2.5rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(192,144,48,0.06) 0%,transparent 100%)}
  .hero-eyebrow{display:inline-block;font-size:0.72rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--border);border-radius:20px;padding:0.25rem 0.85rem;margin-bottom:0.75rem}
  .hero h1{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:800;color:#fff;margin-bottom:0.4rem}
  .hero h1 span{color:var(--gold)}
  .hero-sub{color:var(--muted);max-width:580px;margin:0 auto;font-size:0.88rem}

  /* ── Tabs ── */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface)}
  .tab-btn{flex:1;max-width:200px;padding:0.7rem 1.25rem;font-family:inherit;font-size:0.8rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
  .tab-btn:hover{color:var(--gold)}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

  /* ── Hub: Card Grid ── */
  .wrapper{max-width:1100px;margin:0 auto;padding:1.75rem 1.5rem 3rem}
  .toolbar{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem}
  .filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:0.74rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:0.4rem 0.85rem;border-radius:20px;cursor:pointer;transition:all 0.15s}
  .filter-btn:hover{border-color:var(--gold);color:var(--gold)}
  .filter-btn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
  .search-box{flex:1;min-width:200px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);padding:0.5rem 0.85rem;border-radius:20px;font-family:inherit;font-size:0.82rem;outline:none}
  .search-box:focus{border-color:var(--gold)}
  .search-box::placeholder{color:var(--muted)}
  .count{margin-left:auto;font-size:0.72rem;color:var(--muted);font-family:monospace}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
  .card-link{text-decoration:none;color:inherit;display:block;height:100%}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.4rem;height:100%;transition:all 0.18s ease;display:flex;flex-direction:column;gap:0.75rem;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold);opacity:0.5;transition:opacity 0.18s}
  .card.cat-review::before{background:var(--blue)}.card.cat-plan::before{background:var(--gold)}
  .card.cat-audit::before{background:var(--red)}.card.cat-runbook::before{background:var(--green)}
  .card.cat-postmortem::before{background:var(--orange)}.card.cat-skill::before{background:var(--purple)}
  .card-link:hover .card{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
  .card-link:hover .card::before{opacity:1}
  .card-head{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
  .pill{display:inline-block;font-size:0.62rem;font-weight:700;letter-spacing:0.08em;padding:0.18rem 0.5rem;border-radius:20px;text-transform:uppercase}
  .pill-blue{background:rgba(41,128,185,0.15);color:var(--blue);border:1px solid rgba(41,128,185,0.3)}
  .pill-gold{background:rgba(192,144,48,0.18);color:var(--gold);border:1px solid rgba(192,144,48,0.3)}
  .pill-red{background:rgba(192,57,43,0.15);color:var(--red);border:1px solid rgba(192,57,43,0.3)}
  .pill-green{background:rgba(39,174,96,0.15);color:var(--green);border:1px solid rgba(39,174,96,0.3)}
  .pill-orange{background:rgba(230,126,34,0.15);color:var(--orange);border:1px solid rgba(230,126,34,0.3)}
  .pill-purple{background:rgba(142,68,173,0.15);color:var(--purple);border:1px solid rgba(142,68,173,0.3)}
  .pill-muted{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border)}
  .card-date{font-size:0.7rem;color:var(--muted);font-family:monospace;margin-left:auto}
  .card-title{font-size:1rem;font-weight:700;color:#fff;line-height:1.3}
  .card-summary{font-size:0.82rem;color:var(--muted);line-height:1.55;flex:1}
  .card-foot{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;font-size:0.7rem;color:var(--muted);font-family:monospace;margin-top:auto;padding-top:0.6rem;border-top:1px solid rgba(192,144,48,0.1)}
  .card-tags{display:flex;gap:0.3rem;flex-wrap:wrap}
  .tag{background:rgba(255,255,255,0.04);color:var(--muted);padding:0.1rem 0.4rem;border-radius:3px;font-size:0.66rem}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-style:italic;grid-column:1/-1}
  .add-card{background:var(--card);border:2px dashed var(--border);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:0.85rem;line-height:1.5;min-height:160px}
  .add-card code{font-size:0.78rem;color:var(--gold-light);background:rgba(255,255,255,0.07);padding:0.1rem 0.3rem;border-radius:3px}
  .add-card-title{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-size:0.74rem;margin-bottom:0.4rem}

  /* ── Checklist ── */
  .cl-wrap{max-width:780px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
  .cl-toolbar{display:flex;gap:0.5rem;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap}
  .slug-label{font-size:0.52rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(192,144,48,0.5)}
  .slug-input{font-family:monospace;font-size:0.72rem;padding:0.3rem 0.65rem;border-radius:4px;background:var(--card);color:var(--text);border:1px solid var(--border);width:180px}
  .slug-input:focus{outline:none;border-color:var(--gold)}
  .cl-progress{font-family:monospace;font-size:0.6rem;color:rgba(192,144,48,0.5);margin-left:auto}
  .cl-sections{display:flex;flex-direction:column;gap:1rem}
  .cl-section{background:var(--card);border-radius:8px;border:1px solid var(--border);overflow:hidden}
  .cl-sec-hdr{display:flex;align-items:center;gap:0.5rem;padding:0.7rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background .1s}
  .cl-sec-hdr:hover{background:rgba(192,144,48,0.04)}
  .cl-sec-title{font-size:0.78rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text);flex:1}
  .cl-badge{font-family:monospace;font-size:0.52rem;padding:0.15em 0.5em;border-radius:3px;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap}
  .badge-new{background:rgba(74,48,128,0.15);color:#9b7ee8;border:1px solid rgba(74,48,128,0.3)}
  .badge-regression{background:rgba(192,144,48,0.12);color:var(--gold);border:1px solid rgba(192,144,48,0.3)}
  .badge-infra{background:rgba(39,174,96,0.12);color:var(--green);border:1px solid rgba(39,174,96,0.25)}
  .badge-human{background:rgba(192,57,43,0.1);color:var(--red);border:1px solid rgba(192,57,43,0.25)}
  .cl-sec-status{font-family:monospace;font-size:0.58rem;font-weight:700;white-space:nowrap}
  .st-pass{color:var(--green)}.st-pend{color:rgba(192,144,48,0.4)}.st-fail{color:var(--red)}
  .cl-chevron{font-size:0.55rem;color:rgba(192,144,48,0.35);transition:transform .18s;flex-shrink:0}
  .cl-section.collapsed .cl-chevron{transform:rotate(-90deg)}
  .cl-section.collapsed .cl-sec-hdr{border-bottom:none}
  .cl-section.collapsed .cl-steps,.cl-section.collapsed .human-banner{display:none}
  .human-banner{display:flex;align-items:center;gap:0.4rem;padding:0.4rem 1rem;background:rgba(192,57,43,0.06);border-bottom:1px solid rgba(192,57,43,0.15);font-size:0.55rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--red)}
  .cl-steps{list-style:none;padding:0.3rem 0}
  .cl-step{display:flex;align-items:flex-start;gap:0.7rem;padding:0.5rem 1rem;border-bottom:1px solid rgba(192,144,48,0.07);cursor:pointer;transition:background .1s}
  .cl-step:last-child{border-bottom:none}
  .cl-step:hover{background:rgba(192,144,48,0.04)}
  .cl-step.done{opacity:0.5}
  .cl-step.done .step-text{text-decoration:line-through;color:var(--muted)}
  .cb{width:1.05rem;height:1.05rem;border-radius:3px;border:1.5px solid rgba(192,144,48,0.35);flex-shrink:0;margin-top:0.1rem;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .cl-step.done .cb{background:var(--green);border-color:var(--green)}
  .cb-chk{display:none;color:#fff;font-size:0.6rem;font-weight:900}
  .cl-step.done .cb-chk{display:block}
  .step-body{flex:1;min-width:0}
  .step-text{font-size:0.78rem;line-height:1.4;color:var(--text)}
  .step-link{display:inline-block;margin-top:0.28rem;font-family:monospace;font-size:0.56rem;color:rgba(192,144,48,0.6);text-decoration:none;padding:0.08rem 0.38rem;border-radius:2px;border:1px solid rgba(192,144,48,0.18);transition:all .1s}
  .step-link:hover{color:var(--gold);border-color:rgba(192,144,48,0.45)}
  .step-note{font-size:0.6rem;color:var(--muted);margin-top:0.18rem;font-style:italic;line-height:1.35}
  .reset-btn{font-family:monospace;font-size:0.52rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.25rem 0.65rem;border-radius:3px;background:transparent;color:rgba(192,144,48,0.35);border:1px solid rgba(192,144,48,0.12);cursor:pointer;transition:all .12s;margin-top:0.75rem;display:block;margin-left:auto}
  .reset-btn:hover{color:var(--red);border-color:rgba(192,57,43,0.4)}

  footer{border-top:1px solid var(--border);padding:1.5rem;text-align:center;color:var(--muted);font-size:0.75rem}
  footer span{color:var(--gold)}
  @media(max-width:600px){.nav-links{display:none}.hero{padding:1.75rem 1rem 1.25rem}.wrapper,.cl-wrap{padding-left:1rem;padding-right:1rem}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav>
  <div class="nav-brand">TOURney <span>by Greenskeeper Studios</span></div>
  <div class="nav-links">
    <a href="/">Marketing</a>
    <a href="/create">Create</a>
    <a href="/platform">Platform</a>
    <a href="/qa">QA Hub</a>
    <a href="/urls">URL Map</a>
    <a href="/combos">Combos</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-eyebrow">QA Hub</div>
  <h1><span>Plans</span>, Reviews, Audits &amp; Checklists</h1>
  <p class="hero-sub">Every review, plan, audit, and manual QA checklist — one page.</p>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-hub" onclick="switchTab('hub')">Artifact Hub</button>
  <button class="tab-btn" id="tab-checklist" onclick="switchTab('checklist')">QA Checklist</button>
</div>

<!-- ── HUB PANEL ── -->
<div id="panel-hub">
  <div class="wrapper">
    <div class="toolbar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="review">Reviews</button>
      <button class="filter-btn" data-filter="plan">Plans</button>
      <button class="filter-btn" data-filter="audit">Audits</button>
      <button class="filter-btn" data-filter="runbook">Runbooks</button>
      <button class="filter-btn" data-filter="postmortem">Postmortems</button>
      <input id="searchBox" type="text" class="search-box" placeholder="Search title, summary, tags…">
      <span class="count" id="countLabel">—</span>
    </div>
    <div class="grid" id="cardGrid"><div class="empty">Loading registry…</div></div>
  </div>
</div>

<!-- ── CHECKLIST PANEL ── -->
<div id="panel-checklist" style="display:none">
  <div class="cl-wrap">
    <div class="cl-toolbar">
      <span class="slug-label">Slug</span>
      <input class="slug-input" id="slugInput" type="text" placeholder="e.g. bova">
      <span class="cl-progress" id="progressLabel">— / —</span>
    </div>
    <div class="cl-sections" id="clSections"></div>
    <button class="reset-btn" onclick="resetAll()">Reset all checks</button>
  </div>
</div>

<footer>Backed by <span>qa-index.json</span> · TOURney by Greenskeeper Studios</footer>

<script>
/* ── TAB SWITCH ── */
function switchTab(t) {
  document.getElementById('panel-hub').style.display       = t === 'hub'       ? '' : 'none';
  document.getElementById('panel-checklist').style.display = t === 'checklist' ? '' : 'none';
  document.getElementById('tab-hub').classList.toggle('active', t === 'hub');
  document.getElementById('tab-checklist').classList.toggle('active', t === 'checklist');
  localStorage.setItem('qa_tab', t);
}
// Restore last tab
(function(){ const t = localStorage.getItem('qa_tab') || 'hub'; if (t !== 'hub') switchTab(t); })();

/* ══════════════════════════════════════
   HUB
══════════════════════════════════════ */
const CATEGORY_META = {
  review:     { pill:'pill-blue',   label:'Review' },
  plan:       { pill:'pill-gold',   label:'Plan' },
  audit:      { pill:'pill-red',    label:'Audit' },
  runbook:    { pill:'pill-green',  label:'Runbook' },
  postmortem: { pill:'pill-orange', label:'Postmortem' },
  skill:      { pill:'pill-purple', label:'Skill' },
};
const STATUS_PILL = { 'shipped':'pill-green','in-progress':'pill-gold','queued':'pill-muted','archived':'pill-muted','critical':'pill-red' };

let allEntries = [], activeFilter = 'all', activeSearch = '';

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML;
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? iso : d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function renderHub() {
  const grid = document.getElementById('cardGrid');
  const search = activeSearch.trim().toLowerCase();
  const filtered = allEntries.filter(e => {
    if (activeFilter !== 'all' && e.category !== activeFilter) return false;
    if (!search) return true;
    return [e.title, e.summary, e.author, e.id, ...(e.tags||[])].filter(Boolean).join(' ').toLowerCase().includes(search);
  });
  document.getElementById('countLabel').textContent = `${filtered.length} of ${allEntries.length}`;
  const sorted = filtered.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  grid.innerHTML = (filtered.length ? sorted.map(cardHTML).join('') : `<div class="empty">No matches.</div>`) + addCardHTML();
}
function cardHTML(e) {
  const meta = CATEGORY_META[e.category] || CATEGORY_META.plan;
  const sp = e.status ? (STATUS_PILL[e.status]||'pill-muted') : null;
  const tags = (e.tags||[]).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<a class="card-link" href="${esc(e.url||'#')}"><div class="card cat-${esc(e.category||'plan')}">
    <div class="card-head"><span class="pill ${meta.pill}">${esc(meta.label)}</span>${sp?`<span class="pill ${sp}">${esc(e.status)}</span>`:''}<span class="card-date">${esc(fmtDate(e.date))}</span></div>
    <div class="card-title">${esc(e.title)}</div>
    <div class="card-summary">${esc(e.summary||'')}</div>
    <div class="card-foot">${e.author?`<span>${esc(e.author)}</span>`:''}<div class="card-tags">${tags}</div></div>
  </div></a>`;
}
function addCardHTML() {
  return `<div class="add-card"><div class="add-card-title">+ Add an artifact</div>
    <div>Run <code>/tourney-review</code> or append to <code>qa-index.json</code> and push.</div></div>`;
}
async function loadHub() {
  try {
    const r = await fetch('/qa-index.json', { cache:'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    allEntries = Array.isArray(d.entries) ? d.entries : [];
    renderHub();
  } catch(err) {
    document.getElementById('cardGrid').innerHTML = `<div class="empty">Couldn't load qa-index.json: ${esc(err.message)}</div>` + addCardHTML();
  }
}
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); activeFilter = btn.dataset.filter; renderHub();
  });
});
document.getElementById('searchBox').addEventListener('input', e => { activeSearch = e.target.value; renderHub(); });
loadHub();

/* ══════════════════════════════════════
   CHECKLIST
══════════════════════════════════════ */
const CL_SECTIONS = [
  { id:'pairs', title:'Pairs — New Feature', badge:'new', steps:[
    { id:'p1',  text:'Go to /create — confirm "Pairs" button appears in Team Structure row', link:'/create' },
    { id:'p2',  text:'Select Pairs — confirm "Number of Pairs" picker appears (options 2–24)', link:'/create' },
    { id:'p3',  text:'Pick 4 pairs, 8 players, 2 days — confirm price card updates correctly', link:'/create' },
    { id:'p4',  text:'Complete create wizard — confirm redirects to /admin after creation' },
    { id:'p5',  text:'Admin → assignment section title reads "Pair Assignment"', link:'/admin' },
    { id:'p6',  text:'Admin → pair name fields visible (Pair 1 Name, Pair 2 Name…)', link:'/admin' },
    { id:'p7',  text:'Admin → type a pair name (e.g. "Smith / Jones") → blur → confirm saves', link:'/admin' },
    { id:'p8',  text:'Admin → assign each player to a pair → Save Pair Assignments', link:'/admin' },
    { id:'p9',  text:'Scorecard → log in → confirm "Your Pair" label (not "Your Team")', link:'/scorecard' },
    { id:'p10', text:'Scorecard → confirm opponent section is hidden', link:'/scorecard', note:'"Opponents" panel should not be visible' },
    { id:'p11', text:'Scorecard → enter scores for a hole → submit → no console errors' },
    { id:'p12', text:'Scoreboard → "Pairs" tab visible — click it', link:'/scoreboard' },
    { id:'p13', text:'Scoreboard → pairs leaderboard renders with pair names + scores', link:'/scoreboard' },
    { id:'p14', text:'Scoreboard → after submitting a score, leaderboard updates', link:'/scoreboard' },
  ]},
  { id:'individual', title:'Individual — Regression', badge:'regression', steps:[
    { id:'i1', text:'Create a new Individual tournament via /create', link:'/create' },
    { id:'i2', text:'Scoreboard → no Team tab visible', link:'/scoreboard' },
    { id:'i3', text:'Scorecard → no "Your Team" field visible', link:'/scorecard' },
    { id:'i4', text:'Scorecard → unassigned gate does NOT appear', link:'/scorecard' },
  ]},
  { id:'team', title:'Team (2+ Teams) — Regression', badge:'regression', steps:[
    { id:'t1', text:'Create a 2-team tournament via /create', link:'/create' },
    { id:'t2', text:'Admin → Team Assignment section (not Pair Assignment)', link:'/admin' },
    { id:'t3', text:'Admin → assign players to Team A / Team B → save', link:'/admin' },
    { id:'t4', text:'Scorecard → "Your Team" label (not "Your Pair")', link:'/scorecard' },
    { id:'t5', text:'Scorecard → opponent section visible', link:'/scorecard' },
    { id:'t6', text:'Scoreboard → Team tab shows A vs B banners', link:'/scoreboard' },
  ]},
  { id:'nav', title:'Navigation & Auth', badge:'infra', steps:[
    { id:'n1', text:'Hamburger menu opens on mobile — all links present', link:'/scoreboard' },
    { id:'n2', text:'Admin link appears in nav when logged in as owner', link:'/scoreboard' },
    { id:'n3', text:'Admin link NOT visible when logged out', link:'/scoreboard' },
    { id:'n4', text:'All nav links route correctly — no 404s', link:'/directory' },
  ]},
  { id:'console', title:'Console & Network', badge:'infra', steps:[

    { id:'llc2', text:'File Articles of Organization online at your Secretary of State website', note:'WI: wdfi.org — takes 1–2 business days' },
    { id:'llc3', text:'Get a free EIN from IRS.gov', note:'irs.gov → Businesses → Apply for EIN — instant' },
    { id:'llc4', text:'Draft an Operating Agreement (single-member, simple templates online)', note:'Not legally required in most states but protects liability shield' },

const STORAGE_KEY  = 'qa_checks_v2';
const COLLAPSE_KEY = 'qa_collapsed_v2';
let clSlug = '', clChecked = {}, clCollapsed = {};

function clLoad() {
  try { clChecked   = JSON.parse(localStorage.getItem(STORAGE_KEY)  || '{}'); } catch { clChecked = {}; }
  try { clCollapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch { clCollapsed = {}; }
  clSlug = localStorage.getItem('qa_slug') || '';
}
function clSave() {
  localStorage.setItem(STORAGE_KEY,  JSON.stringify(clChecked));
  localStorage.setItem(COLLAPSE_KEY, JSON.stringify(clCollapsed));
  localStorage.setItem('qa_slug', clSlug);
}
function clUrl(path) {
  return clSlug ? `https://tourney.greenskeeper.studio/t/${clSlug}${path}` : '#';
}
function toggleCheck(id) { clChecked[id] = !clChecked[id]; clSave(); renderChecklist(); }
function toggleSection(id) { clCollapsed[id] = !clCollapsed[id]; clSave(); renderChecklist(); }
function resetAll() { if (!confirm('Reset all checks?')) return; clChecked = {}; clSave(); renderChecklist(); }

function secStatus(s) {
  const done = s.steps.filter(x => clChecked[x.id]).length;
  if (!done) return { label:'—', cls:'st-pend' };
  if (done === s.steps.length) return { label:'PASS', cls:'st-pass' };
  return { label:`${done}/${s.steps.length}`, cls:'st-pend' };
}
function badgeLabel(b) { return b==='new'?'New':b==='regression'?'Regression':b==='human'?'Human':'Infra'; }

function renderChecklist() {
  const all = CL_SECTIONS.flatMap(s => s.steps);
  const done = all.filter(s => clChecked[s.id]).length;
  document.getElementById('progressLabel').textContent = `${done} / ${all.length}`;

  document.getElementById('clSections').innerHTML = CL_SECTIONS.map(sec => {
    const { label, cls } = secStatus(sec);
    const isCollapsed = !!clCollapsed[sec.id];
    const humanBanner = sec.badge === 'human'
      ? `<div class="human-banner">⚠ Human Required — cannot be automated</div>` : '';
    const steps = sec.steps.map(step => {
      const isDone = !!clChecked[step.id];
      const linkHtml = step.link && clSlug
        ? `<a class="step-link" href="${clUrl(step.link)}" target="_blank" onclick="event.stopPropagation()">Open ↗</a>` : '';
      const noteHtml = step.note ? `<div class="step-note">${step.note}</div>` : '';
      return `<li class="cl-step${isDone?' done':''}" onclick="toggleCheck('${step.id}')">
        <div class="cb"><span class="cb-chk">✓</span></div>
        <div class="step-body"><div class="step-text">${step.text}</div>${linkHtml}${noteHtml}</div>
      </li>`;
    }).join('');
    return `<div class="cl-section${isCollapsed?' collapsed':''}">
      <div class="cl-sec-hdr" onclick="toggleSection('${sec.id}')">
        <span class="cl-sec-title">${sec.title}</span>
        <span class="cl-badge badge-${sec.badge}">${badgeLabel(sec.badge)}</span>
        <span class="cl-sec-status ${cls}">${label}</span>
        <span class="cl-chevron">▼</span>
      </div>
      ${humanBanner}
      <ul class="cl-steps">${steps}</ul>
    </div>`;
  }).join('');
}

document.getElementById('slugInput').addEventListener('input', e => {
  clSlug = e.target.value.trim(); clSave(); renderChecklist();
});

clLoad();
document.getElementById('slugInput').value = clSlug;
renderChecklist();
</script>
