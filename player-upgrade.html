<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TOURney by Greenskeeper Studios">
<meta property="og:image" content="/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/icon-512.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1008">
<title>Create My Golf Account — TOURney</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1008;--gold:#c09030;--gold-l:#d4aa50;--gold-p:#e8cc80;--cream:#f0e6cc;--red:#8a1e10;--border:rgba(192,144,48,0.28);--bg:#1a1008;--card:#231a0a;--muted:rgba(240,230,204,0.38);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--cream);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;}
a{color:inherit;text-decoration:none;}

.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;border-bottom:1px solid rgba(192,144,48,0.12);}
.nav-logo{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:0.5rem;}
.nav-logo em{font-style:italic;color:var(--gold);}
.nav-back{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.nav-back:hover{color:var(--gold);}
.pu-ham{display:none;align-items:center;justify-content:center;background:none;border:none;color:rgba(240,230,204,.7);cursor:pointer;padding:.4rem;flex-shrink:0;}
.pu-drawer{display:none;position:fixed;left:0;right:0;top:56px;z-index:198;background:rgba(10,6,2,0.97);border-bottom:1px solid rgba(192,144,48,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.pu-drawer.open{display:block;}
.pu-drawer-inner{display:flex;flex-direction:column;padding:1rem 2rem 1.5rem;gap:0;}
.pu-drawer-inner a{display:block;padding:.7rem 0;font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,230,204,.7);text-decoration:none;border-bottom:1px solid rgba(192,144,48,.08);transition:color .15s;}
.pu-drawer-inner a:hover{color:var(--gold);}
@media(max-width:760px){.pu-ham{display:flex;}.nav-back{display:none;}}

.wrap{max-width:480px;margin:0 auto;padding:4rem 2rem;}
@media(max-width:520px){.wrap{padding:2.5rem 1.25rem;}}

.eyebrow{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(192,144,48,0.5);margin-bottom:0.75rem;}
.headline{font-family:'Playfair Display',serif;font-size:clamp(2rem,8vw,3.2rem);font-weight:900;line-height:1.05;margin-bottom:0.5rem;}
.headline em{font-style:italic;color:var(--gold-p);}
.sub{font-family:'Barlow',sans-serif;font-size:0.95rem;color:rgba(240,230,204,0.55);margin-bottom:2.5rem;line-height:1.6;}

.price-badge{display:inline-flex;align-items:baseline;gap:0.3rem;margin-bottom:2.5rem;}
.price-val{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--gold);line-height:1;}
.price-unit{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}

.features{display:flex;flex-direction:column;gap:0.65rem;margin-bottom:2.5rem;}
.feature{display:flex;align-items:center;gap:0.75rem;font-family:'Barlow',sans-serif;font-size:0.88rem;color:rgba(240,230,204,0.7);}
.feature-icon{width:18px;height:18px;border-radius:50%;background:rgba(192,144,48,0.15);border:1px solid rgba(192,144,48,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.55rem;color:var(--gold);}

.divider{height:1px;background:rgba(192,144,48,0.15);margin:2.5rem 0;}

.form-label{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:0.4rem;}
.form-input{width:100%;background:var(--card);border:1px solid rgba(192,144,48,0.28);padding:0.8rem 0.9rem;color:var(--cream);font-family:'Barlow',sans-serif;font-size:1rem;outline:none;border-radius:0;-webkit-appearance:none;margin-bottom:1rem;}
.form-input:focus{border-color:var(--gold);}
.form-input::placeholder{color:rgba(240,230,204,0.2);}
.form-name-row{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;}

.btn-join{width:100%;padding:1rem;background:var(--gold);color:var(--ink);border:none;font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-top:0.25rem;}
.btn-join:hover:not(:disabled){background:var(--gold-l);}
.btn-join:disabled{opacity:0.4;cursor:not-allowed;}

.fine-print{font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.12em;color:rgba(240,230,204,0.25);margin-top:0.85rem;text-align:center;line-height:1.6;}

.step-title{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:0.2rem;color:#fff;}
.step-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);letter-spacing:0.08em;margin-bottom:2rem;}
.or{font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin:1.5rem 0 1rem;position:relative;}
.or::before,.or::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:rgba(192,144,48,0.18);}
.or::before{left:0;}
.or::after{right:0;}
.auth-foot{font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);text-align:center;}
.auth-foot a{color:var(--gold);cursor:pointer;}
.auth-foot a:hover{text-decoration:underline;}

.form-err{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;color:#c05040;margin-top:0.5rem;display:none;}
.form-err.show{display:block;}

/* CONFIRMATION STATE */
.confirm{display:none;text-align:center;padding:2rem 0;}
.confirm-icon{font-size:2.5rem;margin-bottom:1rem;}
.confirm-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;color:var(--gold-p);margin-bottom:0.75rem;}
.confirm-body{font-family:'Barlow',sans-serif;font-size:0.92rem;color:rgba(240,230,204,0.6);line-height:1.65;margin-bottom:1.5rem;}
.confirm-cta{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.6rem 1.2rem;border:1px solid rgba(192,144,48,0.4);color:var(--gold);display:inline-block;transition:all 0.15s;}
.confirm-cta:hover{background:rgba(192,144,48,0.1);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <svg width="11" height="15" viewBox="0 0 11 15" fill="none"><line x1="2" y1="1" x2="2" y2="14" stroke="#c09030" stroke-width="1.5" stroke-linecap="round"/><path d="M2 2L9.5 4.8L2 7.8Z" fill="#c09030"/></svg>
    TOURney <em>Player</em>
  </div>
  <a href="/player" class="nav-back">← My Golf</a>
  <button id="puHam" class="pu-ham" aria-label="Menu" aria-expanded="false">
    <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true"><line x1="0" y1="1" x2="18" y2="1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="0" y1="7" x2="18" y2="7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="0" y1="13" x2="18" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</nav>
<div id="puDrawer" class="pu-drawer" role="menu">
  <div class="pu-drawer-inner">
    <a href="/player">← My Golf</a>
    <a href="https://tourney.greenskeeper.studio">← TOURney Platform</a>
  </div>
</div>

<div class="wrap">

  <!-- SIGN-UP FORM -->
  <div id="formState">
    <div class="step-title" id="modeTitle">Your My Golf Account</div>
    <div class="step-sub" id="modeSub">Sign up to track all your tournaments — free, forever.</div>

    <form id="signupForm" autocomplete="on">
      <div id="nameRow" class="form-name-row">
        <div>
          <label class="form-label" for="signupFirst">First Name</label>
          <input class="form-input" type="text" id="signupFirst" placeholder="Rob" autocomplete="given-name">
        </div>
        <div>
          <label class="form-label" for="signupLast">Last Name</label>
          <input class="form-input" type="text" id="signupLast" placeholder="Madsen" autocomplete="family-name">
        </div>
      </div>
      <label class="form-label" for="signupEmail">Email</label>
      <input class="form-input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
      <label class="form-label" for="signupPassword">Password</label>
      <input class="form-input" type="password" id="signupPassword" placeholder="Min. 8 characters" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="btn-join" id="joinBtn">Create Account →</button>
      <div id="formErr" class="form-err"></div>
    </form>

    <div class="or">or</div>
    <div class="auth-foot" id="authFoot">Already have an account? <a onclick="toggleMode()">Sign in</a></div>
  </div>

  <!-- CONFIRMATION -->
  <div id="confirmState" class="confirm">
    <div class="confirm-icon">â›³</div>
    <div class="confirm-title" id="confirmTitle">You're in.</div>
    <div class="confirm-body" id="confirmBody"></div>
    <a href="/player" class="confirm-cta">← Back to My Golf</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.min.js" integrity="sha384-iWpUQPQzWsFiosLgsS8o+e6E8y3Gm+EW2m/vAAo7A2H3fuc4KOKEx+5CAord2H2z" crossorigin="anonymous"></script>
<script>
const sb = supabase.createClient(
  'https://jllugkiojeoopitdvzsa.supabase.co',
  'sb_publishable_DnBMNLaSu61ykJ6P_fI2fw_D9DdAScn'
);

function showConfirm(title, bodyHtml) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').innerHTML = bodyHtml;
  document.getElementById('formState').style.display    = 'none';
  document.getElementById('confirmState').style.display = 'block';
}

(function () {
  const sp = new URLSearchParams(location.search);
  const e = sp.get('email');
  if (e) document.getElementById('signupEmail').value = e;
})();

(function () {
  var btn = document.getElementById('puHam');
  var drawer = document.getElementById('puDrawer');
  function close() { drawer.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    var open = drawer.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  drawer.addEventListener('click', function(e) { if (e.target.closest('a')) close(); });
  document.addEventListener('click', function(e) {
    if (!drawer.classList.contains('open')) return;
    if (!drawer.contains(e.target) && !btn.contains(e.target)) close();
  });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });
  window.addEventListener('resize', function() { if (window.innerWidth > 760) close(); });
})();

let signupMode = true;

function toggleMode() {
  signupMode = !signupMode;
  const title    = document.getElementById('modeTitle');
  const sub      = document.getElementById('modeSub');
  const nameRow  = document.getElementById('nameRow');
  const btn      = document.getElementById('joinBtn');
  const foot     = document.getElementById('authFoot');
  const err      = document.getElementById('formErr');
  err.classList.remove('show');
  if (signupMode) {
    title.textContent = 'Your My Golf Account';
    sub.textContent   = 'Sign up to track all your tournaments — free, forever.';
    nameRow.style.display = '';
    btn.textContent   = 'Create Account →';
    foot.innerHTML    = 'Already have an account? <a onclick="toggleMode()">Sign in</a>';
  } else {
    title.textContent = 'Welcome Back';
    sub.textContent   = 'Sign in to your My Golf account.';
    nameRow.style.display = 'none';
    btn.textContent   = 'Sign In →';
    foot.innerHTML    = 'Need an account? <a onclick="toggleMode()">Create one</a>';
  }
}

document.getElementById('signupForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const first    = document.getElementById('signupFirst').value.trim();
  const last     = document.getElementById('signupLast').value.trim();
  const email    = document.getElementById('signupEmail').value.trim().toLowerCase();
  const password = document.getElementById('signupPassword').value;
  const btn      = document.getElementById('joinBtn');
  const err      = document.getElementById('formErr');

  if (!email || !password) return;
  if (signupMode && (!first || !last)) {
    err.textContent = 'First and last name required.';
    err.classList.add('show');
    return;
  }
  if (signupMode && password.length < 8) {
    err.textContent = 'Password must be at least 8 characters.';
    err.classList.add('show');
    return;
  }
  btn.disabled = true;
  btn.textContent = signupMode ? 'Creating account…' : 'Signing in…';
  err.classList.remove('show');

  const sp   = new URLSearchParams(location.search);
  const next = sp.get('next') || '/player';

  try {
    let res;
    if (signupMode) {
      res = await sb.auth.signUp({
        email,
        password,
        options: { data: { first_name: first, last_name: last } },
      });
      if (res.error) throw res.error;
      if (res.data?.session) {
        await sb.from('player_accounts').upsert(
          { email, plan: 'player', billing_status: 'comped', updated_at: new Date().toISOString() },
          { onConflict: 'email' }
        );
        window.location.href = next;
        return;
      }
      // Email confirmation required (mailer_autoconfirm disabled)
      showConfirm('Check your email.',
        `<strong>${first} ${last}</strong> — we sent a confirmation link to <strong>${email}</strong>. Click it, then <a href="${next}" style="color:var(--gold);">continue →</a>.`);
    } else {
      res = await sb.auth.signInWithPassword({ email, password });
      if (res.error) throw res.error;
      window.location.href = next;
      return;
    }
  } catch (e) {
    const m = (e.message || '').toLowerCase();
    err.textContent = /already registered/.test(m) ? 'That email is already registered. Sign in instead.'
                     : /invalid login/.test(m) ? 'Incorrect email or password.'
                     : (e.message || 'Authentication failed.');
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = signupMode ? 'Create Account →' : 'Sign In →';
  }
});
</script>
<script src="/bug-fab.js?v=6" defer></script>
</body>
</html>
