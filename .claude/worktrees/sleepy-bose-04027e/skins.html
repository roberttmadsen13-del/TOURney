<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5ede0">
<link rel="manifest" href="/manifest.json">
<title>Skins — Bova Invitational</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1008;--gold:#c09030;--gold-l:#d4aa50;--gold-p:#e8cc80;--cream:#f0e6cc;--red:#8a1e10;--green:#1a4010;--border:rgba(192,144,48,0.28);--bg:#f5ede0;--card:#fdf8f0;--muted:rgba(26,16,8,0.4);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;}
a{color:inherit;text-decoration:none;}

.nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(10,7,2,0.97);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:0.45rem;color:var(--cream);}
.nav-logo em{font-style:italic;color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:1.5rem;}
.live-dot{display:flex;align-items:center;gap:0.4rem;font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,230,204,0.4);}
.live-dot span{width:6px;height:6px;border-radius:50%;background:#2a7a20;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
.score-btn{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:0.4rem 1.1rem;border:1px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;text-decoration:none;transition:all 0.2s;}
.score-btn:hover{background:var(--gold);color:var(--ink);}
@media(max-width:520px){.nav-right .score-btn:last-child{display:none;}.nav{padding:0 1rem;}}

.header-band{padding:2.5rem 2rem 2rem;max-width:1100px;margin:0 auto;}
.event-eyebrow{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(192,144,48,0.6);margin-bottom:0.5rem;}
.event-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:900;line-height:1;margin-bottom:0.3rem;}
.event-title em{font-style:italic;color:var(--gold);}
.event-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}

.tab-bar{border-bottom:1px solid var(--border);padding:0 2rem;max-width:1100px;margin:0 auto;display:flex;gap:0;}
.tab{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:0.9rem 1.5rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover{color:var(--ink);}

.main{max-width:1100px;margin:0 auto;padding:2rem;}
@media(max-width:520px){.main{padding:1.2rem 1rem;}.tab-bar{padding:0 1rem;}.header-band{padding:1.5rem 1rem 1rem;}}

/* TOTALS */
.totals-card{background:var(--card);border:1px solid var(--border);padding:1.5rem;margin-bottom:2rem;}
.totals-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.totals-title{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--gold);}
.totals-note{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.15em;color:var(--muted);}
.totals-table{width:100%;border-collapse:collapse;}
.totals-table th,.totals-table td{padding:0.55rem 0.6rem;text-align:left;border-bottom:1px solid rgba(26,16,8,0.07);}
.totals-table th{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:400;}
.totals-table td.num,.totals-table th.num{text-align:right;font-family:'DM Mono',monospace;}
.totals-table .pname{font-family:'Playfair Display',serif;font-weight:700;}
.totals-table .count{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;color:var(--ink);}
.totals-table .count.zero{color:rgba(26,16,8,0.2);}
.totals-table tr.gold .count{color:var(--gold);}

/* ROUND BLOCK */
.round-block{background:var(--card);border:1px solid var(--border);margin-bottom:1.5rem;}
.round-head{padding:0.9rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(192,144,48,0.04);}
.round-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;}
.round-tag{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.round-tag .live{color:#2a7a20;}

.hole-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--border);}
.hole-row{background:var(--card);padding:0.7rem 0.9rem;display:flex;flex-direction:column;gap:0.2rem;}
.hole-row.won{background:rgba(192,144,48,0.08);}
.hole-row.carry{background:rgba(26,16,8,0.03);}
.hole-row.pending{opacity:0.5;}
.hole-num{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.hole-result{font-family:'Playfair Display',serif;font-size:0.85rem;font-weight:700;}
.hole-result.carry{font-style:italic;color:var(--muted);font-weight:400;}
.hole-result.won{color:var(--gold);}
.hole-skins{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.1em;color:var(--muted);}

.round-summary{padding:0.8rem 1.2rem;display:flex;gap:1.5rem;flex-wrap:wrap;border-top:1px solid var(--border);background:rgba(192,144,48,0.02);}
.rs-item{display:flex;flex-direction:column;gap:0.2rem;}
.rs-label{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.rs-val{font-family:'Playfair Display',serif;font-size:0.85rem;font-weight:700;}

.empty-state{text-align:center;padding:4rem 2rem;font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:var(--muted);}
.loading{text-align:center;padding:3rem;font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);}

.last-updated{text-align:right;font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);padding-top:1.5rem;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><img id="navLogoImg" style="display:none;height:32px;max-width:120px;object-fit:contain;object-position:left"><svg id="navLogoSvg" width="14" height="18" viewBox="0 0 14 18" style="flex-shrink:0;display:block" fill="none"><line x1="2" y1="1" x2="2" y2="17" stroke="#c09030" stroke-width="1.5" stroke-linecap="round"/><path d="M2 2L12 5.5L2 9.5Z" fill="#c09030"/></svg>The Bova <em>Invitational</em></div>
  <div class="nav-right">
    <div class="live-dot"><span></span>Live</div>
    <a href="/scoreboard" class="score-btn" style="border-color:rgba(192,144,48,0.3);color:rgba(240,230,204,0.4);">Scoreboard</a>
    <a href="/contests" class="score-btn" style="border-color:rgba(192,144,48,0.3);color:rgba(240,230,204,0.4);">Contests</a>
    <a href="/" class="score-btn" style="border-color:rgba(192,144,48,0.3);color:rgba(240,230,204,0.4);">Home</a>
  </div>
</nav>

<div class="header-band">
  <div class="event-eyebrow">Side Game &nbsp;&middot;&nbsp; Per Round</div>
  <div class="event-title">The <em>Skins</em> Game</div>
  <div class="event-sub">Low score wins the hole &nbsp;&middot;&nbsp; Ties carry forward</div>
</div>

<div class="main">
  <div id="content">
    <div class="loading">Loading skins...</div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://jllugkiojeoopitdvzsa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DnBMNLaSu61ykJ6P_fI2fw_D9DdAScn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_PARS = {
  day1:[4,4,5,3,4,4,3,5,4,4,4,3,5,4,4,3,5,4],
  day2:[4,4,5,3,4,4,3,5,4,4,4,3,5,4,4,3,5,4],
  day3:[4,4,5,3,4,4,3,5,4,4,4,3,5,4,4,3,5,4],
};
const ROUNDS = ['day1','day2','day3'];
const ROUND_LABEL = { day1:'Day 1', day2:'Day 2', day3:'Day 3' };

let players = [];
let scores = [];
let roundStates = {};
let coursePars = JSON.parse(JSON.stringify(DEFAULT_PARS));
let currentRound = null;

async function init() {
  const [pRes, sRes, rRes, parRes] = await Promise.all([
    sb.from('players').select('*'),
    sb.from('scores').select('*'),
    sb.from('settings').select('*').in('key',['round_day1','round_day2','round_day3']),
    sb.from('settings').select('*').in('key',['pars_day1','pars_day2','pars_day3']),
  ]);
  players = pRes.data || [];
  scores = sRes.data || [];
  (rRes.data || []).forEach(r => { roundStates[r.key.replace('round_','')] = r.value; });
  (parRes.data || []).forEach(r => {
    const day = r.key.replace('pars_','');
    try { coursePars[day] = JSON.parse(r.value); } catch {}
  });
  currentRound = Object.entries(roundStates).find(([,v]) => v === 'open')?.[0] || null;
  render();
  updateTimestamp();
  subscribeRealtime();
}

function nameOf(pid) {
  const p = players.find(pp => pp.id === pid);
  return p ? `${p.first_name} ${p.last_name}` : 'Unknown';
}

// Core: compute skins per round
function computeRoundSkins(round) {
  const pars = coursePars[round] || DEFAULT_PARS[round];
  const rScores = scores.filter(s => s.round === round);
  const activePlayers = [...new Set(rScores.map(s => s.player_id))];
  const results = [];
  let carry = 0;
  const winsByPlayer = {};
  let totalAwarded = 0;

  for (let h = 1; h <= 18; h++) {
    const par = pars[h-1] || 4;
    const holeScores = activePlayers.map(pid => {
      const rec = rScores.find(s => s.player_id === pid && s.hole === h);
      return rec ? { player_id: pid, gross: rec.gross_score } : null;
    }).filter(Boolean);

    if (!holeScores.length || holeScores.length < activePlayers.length) {
      // Pending — not all players have score yet
      results.push({ hole: h, par, status: 'pending' });
      continue;
    }

    const lowest = Math.min(...holeScores.map(s => s.gross));
    const winners = holeScores.filter(s => s.gross === lowest);
    const skinsValue = 1 + carry;

    if (winners.length === 1) {
      const w = winners[0];
      winsByPlayer[w.player_id] = (winsByPlayer[w.player_id] || 0) + skinsValue;
      totalAwarded += skinsValue;
      results.push({ hole: h, par, status: 'won', winner: w.player_id, score: w.gross, skins: skinsValue });
      carry = 0;
    } else {
      carry += 1;
      results.push({ hole: h, par, status: 'carry', tiedAt: lowest, tiedBy: winners.map(w => w.player_id), skins: skinsValue });
    }
  }
  return { round, results, winsByPlayer, carry, totalAwarded, activePlayers };
}

function render() {
  const host = document.getElementById('content');
  const anyScores = scores.length > 0;
  if (!anyScores) {
    host.innerHTML = '<div class="empty-state">No scores recorded yet. Skins will appear once scoring starts.</div>';
    return;
  }

  // Per-round skin results
  const roundsWithScores = ROUNDS.filter(r => scores.some(s => s.round === r));
  if (currentRound && !roundsWithScores.includes(currentRound)) roundsWithScores.push(currentRound);

  const allRoundResults = roundsWithScores.map(r => computeRoundSkins(r));

  // Running totals: sum wins across all rounds
  const runningTotals = {};
  allRoundResults.forEach(rr => {
    Object.entries(rr.winsByPlayer).forEach(([pid, n]) => {
      runningTotals[pid] = (runningTotals[pid] || 0) + n;
    });
  });

  // Totals table (include all registered players, sorted by skins desc)
  const totalRows = players.map(p => ({
    id: p.id,
    name: `${p.first_name} ${p.last_name}`,
    skins: runningTotals[p.id] || 0,
  })).sort((a,b) => b.skins - a.skins);

  let html = `<div class="totals-card">
    <div class="totals-head">
      <div class="totals-title">Running Totals &mdash; All Rounds</div>
      <div class="totals-note">Ties carry, reset each round</div>
    </div>
    <table class="totals-table">
      <thead><tr><th>Player</th><th class="num">Skins</th></tr></thead>
      <tbody>
        ${totalRows.map((r,i) => `<tr class="${i===0 && r.skins>0 ? 'gold' : ''}">
          <td class="pname">${r.name}</td>
          <td class="num"><span class="count ${r.skins===0?'zero':''}">${r.skins}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  // Per-round breakdown
  allRoundResults.forEach(rr => {
    const isLive = rr.round === currentRound;
    const winnerRows = Object.entries(rr.winsByPlayer).map(([pid, n]) => ({pid, n})).sort((a,b) => b.n - a.n);

    html += `<div class="round-block">
      <div class="round-head">
        <div class="round-title">${ROUND_LABEL[rr.round]}</div>
        <div class="round-tag">${isLive ? '<span class="live">&#9679; Live</span>' : 'Completed'}</div>
      </div>
      <div class="hole-list">
        ${rr.results.map(h => {
          if (h.status === 'pending') {
            return `<div class="hole-row pending">
              <div class="hole-num">Hole ${h.hole} &middot; Par ${h.par}</div>
              <div class="hole-result carry">Pending...</div>
            </div>`;
          }
          if (h.status === 'carry') {
            return `<div class="hole-row carry">
              <div class="hole-num">Hole ${h.hole} &middot; Par ${h.par}</div>
              <div class="hole-result carry">Tied at ${h.tiedAt} &mdash; carry</div>
              <div class="hole-skins">${h.skins} skin${h.skins===1?'':'s'} carried</div>
            </div>`;
          }
          return `<div class="hole-row won">
            <div class="hole-num">Hole ${h.hole} &middot; Par ${h.par}</div>
            <div class="hole-result won">${nameOf(h.winner)} &middot; ${h.score}</div>
            <div class="hole-skins">+${h.skins} skin${h.skins===1?'':'s'}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="round-summary">
        <div class="rs-item"><div class="rs-label">Awarded</div><div class="rs-val">${rr.totalAwarded}</div></div>
        <div class="rs-item"><div class="rs-label">Carried</div><div class="rs-val">${rr.carry}</div></div>
        ${winnerRows.slice(0,3).map(w => `<div class="rs-item"><div class="rs-label">${nameOf(w.pid)}</div><div class="rs-val">${w.n} skin${w.n===1?'':'s'}</div></div>`).join('')}
      </div>
    </div>`;
  });

  host.innerHTML = html;
}

function subscribeRealtime() {
  sb.channel('skins-scores')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'scores' }, payload => {
      if (payload.eventType === 'INSERT') scores.push(payload.new);
      else if (payload.eventType === 'UPDATE') {
        const i = scores.findIndex(s => s.id === payload.new.id);
        if (i >= 0) scores[i] = payload.new; else scores.push(payload.new);
      } else if (payload.eventType === 'DELETE') {
        scores = scores.filter(s => s.id !== payload.old.id);
      }
      render();
      updateTimestamp();
    })
    .subscribe();
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('lastUpdated').textContent = `Last updated ${now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',hour12:true})}`;
}

async function loadNavLogo() {
  const { data } = await sb.from('settings').select('value').eq('key','logo_url').maybeSingle();
  if (data?.value) {
    const img = document.getElementById('navLogoImg');
    const svg = document.getElementById('navLogoSvg');
    if (img) { img.src = data.value; img.style.display = 'block'; }
    if (svg) svg.style.display = 'none';
  }
}

init();
loadNavLogo();
</script>
<script src="/pwa.js"></script>
</body>
</html>
