<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/platform-icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOURney">
<link rel="manifest" href="/platform-manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform — TOURney</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0a06;color:#f0e6cc;font-family:'Barlow',sans-serif;min-height:100vh;}
.topbar{background:#1a1008;border-bottom:1px solid rgba(192,144,48,0.2);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;}
.topbar-brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:0.2em;text-transform:uppercase;color:#c09030;}
.topbar-user{font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.12em;color:rgba(240,230,204,0.35);display:flex;align-items:center;gap:1rem;}
.btn-sm{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.4rem 0.9rem;border:1px solid rgba(192,144,48,0.4);background:none;color:#c09030;cursor:pointer;transition:all 0.2s;}
.btn-sm:hover{background:rgba(192,144,48,0.08);}
.main{max-width:1100px;margin:0 auto;padding:2.5rem 2rem;}
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;}
.page-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.8rem;letter-spacing:0.06em;text-transform:uppercase;color:#f0e6cc;}
.page-title span{color:#c09030;}
.stat-row{display:flex;gap:1.5rem;margin-bottom:2.5rem;}
.stat{background:#1a1008;border:1px solid rgba(192,144,48,0.12);padding:1.2rem 1.5rem;flex:1;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:700;color:#c09030;line-height:1;}
.stat-label{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,230,204,0.35);margin-top:0.4rem;}
table{width:100%;border-collapse:collapse;}
thead th{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,230,204,0.35);text-align:left;padding:0 1rem 0.8rem;border-bottom:1px solid rgba(192,144,48,0.15);}
tbody tr{border-bottom:1px solid rgba(192,144,48,0.06);transition:background 0.15s;}
tbody tr:hover{background:rgba(192,144,48,0.03);}
td{padding:1rem;font-size:0.88rem;vertical-align:middle;}
.t-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;letter-spacing:0.04em;color:#f0e6cc;}
.t-slug{font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.1em;color:#c09030;margin-top:2px;}
.t-owner{font-family:'DM Mono',monospace;font-size:0.55rem;color:rgba(240,230,204,0.45);}
.t-count{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:600;color:#c09030;}
.t-date{font-family:'DM Mono',monospace;font-size:0.5rem;color:rgba(240,230,204,0.3);}
.actions{display:flex;gap:0.5rem;}
.btn-action{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.35rem 0.75rem;border:1px solid;background:none;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
.btn-admin{color:#c09030;border-color:rgba(192,144,48,0.35);}
.btn-admin:hover{background:rgba(192,144,48,0.1);}
.btn-delete{color:rgba(200,80,60,0.7);border-color:rgba(200,80,60,0.2);}
.btn-delete:hover{background:rgba(200,80,60,0.08);color:#c8503c;border-color:rgba(200,80,60,0.5);}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.25rem 0.6rem;border:1px solid;}
.badge-live{color:#3a9e5f;border-color:rgba(58,158,95,0.4);background:rgba(58,158,95,0.08);}
.badge-notlive{color:rgba(240,230,204,0.25);border-color:rgba(240,230,204,0.08);}
.badge-complete{color:#c09030;border-color:rgba(192,144,48,0.4);background:rgba(192,144,48,0.06);}
.empty{text-align:center;padding:4rem;font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(240,230,204,0.2);}
#loginWrap{max-width:400px;margin:8rem auto;padding:2.5rem;background:#1a1008;border:1px solid rgba(192,144,48,0.15);}
#loginWrap h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:0.12em;text-transform:uppercase;color:#c09030;margin-bottom:1.5rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(240,230,204,0.4);margin-bottom:0.4rem;}
.field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(192,144,48,0.2);color:#f0e6cc;font-family:'DM Mono',monospace;font-size:0.75rem;padding:0.65rem 0.8rem;outline:none;}
.field input:focus{border-color:rgba(192,144,48,0.5);}
.btn-login{width:100%;background:#c09030;color:#1a1008;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.9rem;cursor:pointer;margin-top:0.5rem;transition:background 0.2s;}
.btn-login:hover{background:#d4aa50;}
.err{color:#c8503c;font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.1em;margin-top:0.75rem;display:none;}
.err.show{display:block;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <h2>Platform <span style="color:#f0e6cc">Admin</span></h2>
  <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="rob@greenskeeper.studio"></div>
  <div class="field"><label>Password</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn-login" onclick="doLogin()">Sign In</button>
  <div class="err" id="loginErr">Access denied.</div>
</div>

<!-- DASHBOARD (hidden until auth) -->
<div id="dashboard" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand">TOURney Platform</div>
    <div class="topbar-user">
      <span id="authedEmail"></span>
      <button class="btn-sm" onclick="doSignOut()">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="page-hd">
      <div class="page-title">All <span>Tournaments</span></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="stat-val" id="statTotal">—</div><div class="stat-label">Total Tournaments</div></div>
      <div class="stat"><div class="stat-val" id="statPlayers">—</div><div class="stat-label">Total Players</div></div>
      <div class="stat"><div class="stat-val" id="statOwners">—</div><div class="stat-label">Unique Owners</div></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tournament</th>
          <th>Owner</th>
          <th>Status</th>
          <th>Players</th>
          <th>Created</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tourneyBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No tournaments yet.</div>

    <!-- PLAYER ACCOUNTS -->
    <div class="page-hd" style="margin-top:3rem;">
      <div class="page-title">Player <span>Accounts</span></div>
    </div>
    <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;align-items:flex-end;">
      <div class="field" style="flex:1;margin:0;"><label>Email to comp</label><input type="email" id="compEmail" placeholder="player@email.com"></div>
      <button class="btn-login" style="width:auto;margin:0;padding:0.65rem 1.5rem;white-space:nowrap;" onclick="grantComp()">Grant Access</button>
    </div>
    <div class="err" id="compErr" style="margin-bottom:1rem;display:none;"></div>
    <div id="compSuccess" style="display:none;font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.1em;color:#3a9e5f;margin-bottom:1rem;"></div>
    <table>
      <thead><tr><th>Email</th><th>Status</th><th>Granted</th><th></th></tr></thead>
      <tbody id="compBody"></tbody>
    </table>
    <div class="empty" id="compEmpty" style="display:none;">No comped accounts yet.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const PLATFORM_EMAIL = 'robert.t.madsen13@gmail.com';
const sb = supabase.createClient(
  'https://jllugkiojeoopitdvzsa.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsbHVna2lvamVvb3BpdGR2enNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjc2MzYsImV4cCI6MjA5MTg0MzYzNn0.gvvK5IhTYdUPxsdmxq8pFiCD4CAINJ-fmnKuwDN0KLs'
);

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.classList.remove('show');
  if (email !== PLATFORM_EMAIL) { err.classList.add('show'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { err.classList.add('show'); return; }
  showDashboard(email);
}

async function doSignOut() {
  await sb.auth.signOut();
  location.reload();
}

async function showDashboard(email) {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('authedEmail').textContent = email;
  loadTournaments();
  loadCompAccounts();
}

function deriveStatus(roundSettings) {
  if (!roundSettings.length) return 'notlive';
  const vals = roundSettings.map(r => (r.value || '').toLowerCase());
  if (vals.every(v => v === 'complete' || v === 'done')) return 'complete';
  if (vals.some(v => v === 'active' || v === 'live')) return 'live';
  return 'notlive';
}

function statusBadge(status) {
  if (status === 'live')     return '<span class="badge badge-live">Live</span>';
  if (status === 'complete') return '<span class="badge badge-complete">Complete</span>';
  return '<span class="badge badge-notlive">Not Live</span>';
}

async function loadTournaments() {
  const [{ data: tourneys }, { data: players }, { data: rounds }] = await Promise.all([
    sb.from('tournaments').select('*').order('created_at', { ascending: false }),
    sb.from('players').select('tournament_id'),
    sb.from('settings').select('tournament_id,value').like('key', 'round_day%'),
  ]);

  if (!tourneys || !tourneys.length) { document.getElementById('emptyMsg').style.display = 'block'; return; }

  const counts = {};
  (players || []).forEach(p => { counts[p.tournament_id] = (counts[p.tournament_id] || 0) + 1; });

  const roundsByTourney = {};
  (rounds || []).forEach(r => {
    if (!roundsByTourney[r.tournament_id]) roundsByTourney[r.tournament_id] = [];
    roundsByTourney[r.tournament_id].push(r);
  });

  document.getElementById('statTotal').textContent = tourneys.length;
  document.getElementById('statPlayers').textContent = (players || []).length;
  document.getElementById('statOwners').textContent = new Set(tourneys.map(t => t.owner_email)).size;

  const tbody = document.getElementById('tourneyBody');
  tbody.innerHTML = tourneys.map(t => {
    const count = counts[t.id] || 0;
    const created = new Date(t.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const status = deriveStatus(roundsByTourney[t.id] || []);
    const adminUrl = `/t/${t.slug}/admin`;
    return `<tr>
      <td>
        <div class="t-name">${esc(t.name || t.short_name || '—')}</div>
        <div class="t-slug">${esc(t.slug)}</div>
      </td>
      <td><div class="t-owner">${esc(t.owner_email || '—')}</div></td>
      <td>${statusBadge(status)}</td>
      <td><div class="t-count">${count}</div></td>
      <td><div class="t-date">${created}</div></td>
      <td>
        <div class="actions">
          <a class="btn-action btn-admin" href="${esc(adminUrl)}">Admin</a>
          <button class="btn-action btn-delete" onclick="deleteTourney('${t.id}','${esc(t.name || t.slug)}')">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function deleteTourney(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  await sb.from('players').delete().eq('tournament_id', id);
  await sb.from('settings').delete().eq('tournament_id', id);
  await sb.from('tournaments').delete().eq('id', id);
  loadTournaments();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function grantComp() {
  const email = document.getElementById('compEmail').value.trim().toLowerCase();
  const errEl = document.getElementById('compErr');
  const okEl  = document.getElementById('compSuccess');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = 'Invalid email.'; errEl.style.display = 'block'; return;
  }
  const { error } = await sb.from('player_accounts').upsert(
    { email, plan: 'player', billing_status: 'comped', billing_expires_at: null, updated_at: new Date().toISOString() },
    { onConflict: 'email' }
  );
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  okEl.textContent = `✓ ${email} granted player account`; okEl.style.display = 'block';
  document.getElementById('compEmail').value = '';
  loadCompAccounts();
}

async function revokeComp(email) {
  if (!confirm(`Revoke player account for ${email}?`)) return;
  await sb.from('player_accounts').update({ billing_status: 'inactive', updated_at: new Date().toISOString() }).eq('email', email);
  loadCompAccounts();
}

async function loadCompAccounts() {
  const { data } = await sb.from('player_accounts').select('*').order('created_at', { ascending: false });
  const tbody = document.getElementById('compBody');
  const empty = document.getElementById('compEmpty');
  if (!data || !data.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = data.map(a => {
    const created = new Date(a.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const statusColor = a.billing_status === 'comped' ? '#3a9e5f' : a.billing_status === 'active' ? '#c09030' : 'rgba(240,230,204,0.25)';
    return `<tr>
      <td><div class="t-owner">${esc(a.email)}</div></td>
      <td><span class="badge" style="color:${statusColor};border-color:${statusColor}40;">${esc(a.billing_status)}</span></td>
      <td><div class="t-date">${created}</div></td>
      <td><div class="actions"><button class="btn-action btn-delete" onclick="revokeComp('${esc(a.email)}')">Revoke</button></div></td>
    </tr>`;
  }).join('');
}


(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user?.email === PLATFORM_EMAIL) showDashboard(session.user.email);
})();
</script>
</body>
</html>
