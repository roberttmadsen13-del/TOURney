<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost on the Course — TOURney</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400&family=DM+Mono:wght@400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:#0e0b06;color:#f0e6cc;font-family:'Barlow Condensed',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;}
.eyebrow{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(192,144,48,0.55);margin-bottom:1.5rem;}
.num{font-family:'Playfair Display',serif;font-size:clamp(5rem,20vw,9rem);font-weight:900;color:rgba(192,144,48,0.12);line-height:1;margin-bottom:0.5rem;letter-spacing:-0.02em;}
.title{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;margin-bottom:0.5rem;}
.title em{font-style:italic;color:#c09030;}
.sub{font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,230,204,0.3);margin-bottom:2.5rem;}
.rule{display:flex;align-items:center;gap:1rem;justify-content:center;margin-bottom:2.5rem;}
.rule-line{width:40px;height:1px;background:rgba(192,144,48,0.25);}
.rule-diamond{width:5px;height:5px;background:rgba(192,144,48,0.4);transform:rotate(45deg);}
.links{display:flex;gap:1px;background:rgba(192,144,48,0.15);}
.link{display:block;padding:0.85rem 1.5rem;background:#0e0b06;font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(240,230,204,0.4);text-decoration:none;transition:all 0.2s;}
.link:hover{background:rgba(192,144,48,0.06);color:#c09030;}
@media(max-width:400px){.links{flex-direction:column;}.link{text-align:center;}}
</style>
</head>
<body>
<div class="eyebrow">Out of bounds</div>
<div class="num">404</div>
<div class="title">Lost on the <em>Course</em></div>
<div class="sub">This hole doesn't exist</div>
<div class="rule">
  <div class="rule-line"></div>
  <div class="rule-diamond"></div>
  <div class="rule-line"></div>
</div>
<div class="links">
  <a class="link" href="/scoreboard">Leaderboard</a>
  <a class="link" href="/scorecard">Scorecard</a>
  <a class="link" href="/feed">Feed</a>
  <a class="link" href="/">Home</a>
</div>
<script>
const _m = location.pathname.match(/\/t\/([^/?#]+)/);
if (_m) {
  const _s = _m[1];
  document.querySelectorAll('a[href^="/"]').forEach(a => {
    const h = a.getAttribute('href');
    if (!h.startsWith('/t/')) a.setAttribute('href', h === '/' ? `/t/${_s}` : `/t/${_s}${h}`);
  });
}
// Auto-log 404 hit to platform_bugs
(function(){
  const _ep = 'https://jllugkiojeoopitdvzsa.supabase.co/functions/v1/log-client-error';
  const _payload = { type: 'page-404', message: '404 — ' + location.href, source: document.referrer || '', stack: '', url: location.href };
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(_ep, JSON.stringify(_payload));
    else fetch(_ep, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(_payload), keepalive: true }).catch(()=>{});
  } catch(_) {}
})();
</script>
<script src="/bug-fab.js?v=6" defer></script>
</body>
</html>
