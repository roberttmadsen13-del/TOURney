<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5ede0">
<link rel="manifest" href="/manifest.json">
<title>Trash Talk — Bova Invitational</title>
<!--
  REQUIRED SQL MIGRATION (run in Supabase SQL editor before using this page):

  CREATE TABLE public.trash_talk (
    id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
    created_at timestamptz DEFAULT now() NOT NULL,
    player_name text NOT NULL,
    team text,
    message text NOT NULL
  );
  ALTER TABLE public.trash_talk ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "public read"   ON public.trash_talk FOR SELECT USING (true);
  CREATE POLICY "public insert" ON public.trash_talk FOR INSERT WITH CHECK (true);
-->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1008;--gold:#c09030;--gold-l:#d4aa50;--gold-p:#e8cc80;--cream:#f0e6cc;--red:#8a1e10;--green:#1a4010;--border:rgba(192,144,48,0.28);--bg:#f5ede0;--card:#fdf8f0;--muted:rgba(26,16,8,0.4);--blue:#4a6a8a;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;}
a{color:inherit;text-decoration:none;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(14,11,6,0.97);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:0.45rem;color:var(--cream);}
.nav-logo em{font-style:italic;color:var(--gold);}
.nav-links{display:flex;gap:1.2rem;align-items:center;}
.nav-links a{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(240,230,204,0.4);}
.nav-links a:hover{color:var(--cream);}
.nav-links a.active{color:var(--gold);}
@media(max-width:520px){.nav{padding:0 1rem;}.nav-links a:not(.active){display:none;}}

/* PAGE HEADER */
.page-header{max-width:780px;margin:0 auto;padding:2.5rem 2rem 1.5rem;}
.page-eyebrow{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(192,144,48,0.5);margin-bottom:0.5rem;}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;line-height:1;margin-bottom:0.3rem;}
.page-title em{font-style:italic;color:var(--gold);}
.page-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);}

/* MAIN */
.main{max-width:780px;margin:0 auto;padding:1.5rem 2rem 4rem;}
@media(max-width:520px){.main{padding:1rem 1rem 3rem;}.page-header{padding:1.5rem 1rem 1rem;}}

/* COMPOSE */
.compose-card{background:var(--card);border:1px solid var(--border);padding:1.5rem;margin-bottom:2rem;}
.compose-label{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:0.8rem;display:block;}
.compose-select{width:100%;margin-bottom:0.75rem;font-family:'Barlow',sans-serif;font-size:0.88rem;padding:0.6rem 0.8rem;background:var(--bg);border:1px solid var(--border);color:var(--ink);appearance:none;-webkit-appearance:none;cursor:pointer;outline:none;}
.compose-select:focus{border-color:var(--gold);}
.compose-textarea{width:100%;font-family:'Barlow',sans-serif;font-size:0.92rem;padding:0.75rem 0.9rem;background:var(--bg);border:1px solid var(--border);color:var(--ink);resize:vertical;min-height:72px;max-height:160px;outline:none;line-height:1.55;}
.compose-textarea:focus{border-color:var(--gold);}
.compose-textarea::placeholder{color:var(--muted);font-style:italic;}
.compose-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.65rem;}
.compose-char{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.1em;color:var(--muted);}
.compose-char.warn{color:var(--gold);}
.compose-char.over{color:var(--red);}
.compose-submit{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:0.55rem 1.6rem;border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer;transition:all 0.18s;}
.compose-submit:hover:not(:disabled){background:var(--gold-l);border-color:var(--gold-l);}
.compose-submit:disabled{opacity:0.38;cursor:not-allowed;}

/* FEED */
.feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.feed-title{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--muted);}
.live-badge{display:flex;align-items:center;gap:0.35rem;font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.live-badge .dot{width:6px;height:6px;border-radius:50%;background:#2a7a20;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}

.feed-list{display:flex;flex-direction:column;gap:0.75rem;}

/* POST CARD */
.post-card{background:var(--card);border:1px solid var(--border);border-left-width:3px;padding:1rem 1.2rem;animation:slideIn 0.22s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.post-card.team-a{border-left-color:var(--gold);background:linear-gradient(to right,rgba(192,144,48,0.04),var(--card));}
.post-card.team-b{border-left-color:var(--blue);background:linear-gradient(to right,rgba(74,106,138,0.06),var(--card));}
.post-card.team-none{border-left-color:rgba(26,16,8,0.18);}
.post-meta{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap;}
.post-name{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;color:var(--ink);}
.post-team-badge{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.15rem 0.45rem;}
.post-team-badge.team-a{background:rgba(192,144,48,0.14);color:var(--gold);}
.post-team-badge.team-b{background:rgba(74,106,138,0.14);color:var(--blue);}
.post-time{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.08em;color:var(--muted);margin-left:auto;}
.post-message{font-family:'Barlow',sans-serif;font-size:0.95rem;font-weight:400;color:var(--ink);line-height:1.55;}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:4rem 2rem;border:1px solid var(--border);background:var(--card);}
.empty-heading{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;font-style:italic;color:rgba(192,144,48,0.3);margin-bottom:0.6rem;}
.empty-sub{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);}
.loading-state{text-align:center;padding:3rem;font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.65rem 1.2rem;background:rgba(14,11,6,0.95);border:1px solid var(--border);transform:translateY(120px);opacity:0;transition:all 0.28s ease;z-index:999;max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{color:var(--gold);}
.toast.error{color:var(--red);}
</style>
<link rel="stylesheet" href="/nav-mobile.css">
<script defer src="/nav-mobile.js"></script>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <img id="navLogoImg" style="display:none;height:32px;max-width:120px;object-fit:contain;object-position:left" alt="">
    <svg id="navLogoSvg" width="14" height="18" viewBox="0 0 14 18" style="flex-shrink:0" fill="none"><line x1="2" y1="1" x2="2" y2="17" stroke="#c09030" stroke-width="1.5" stroke-linecap="round"/><path d="M2 2L12 5.5L2 9.5Z" fill="#c09030"/></svg>
    The Bova <em>Invitational</em>
  </a>
  <div class="nav-links">
    <a href="/scoreboard">Leaderboard</a>
    <a href="/scorecard">Enter Scores</a>
    <a href="/directory">Directory</a>
    <a href="/feed" class="active">Feed</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow">Myrtle Beach, SC &nbsp;&middot;&nbsp; 2026</div>
  <div class="page-title">Trash <em>Talk</em></div>
  <div class="page-sub">Sound off &nbsp;&middot;&nbsp; Real-time &nbsp;&middot;&nbsp; No mercy</div>
</div>

<div class="main">

  <div class="compose-card">
    <span class="compose-label">Post to the feed</span>
    <select class="compose-select" id="playerSelect">
      <option value="">Select your name...</option>
    </select>
    <textarea
      class="compose-textarea"
      id="messageInput"
      placeholder="Talk your game... or someone else's."
      maxlength="280"
    ></textarea>
    <div class="compose-footer">
      <span class="compose-char" id="charCount">280</span>
      <button class="compose-submit" id="submitBtn" onclick="postMessage()" disabled>Post It</button>
    </div>
  </div>

  <div class="feed-header">
    <span class="feed-title" id="feedTitle">Feed</span>
    <div class="live-badge"><span class="dot"></span>Live</div>
  </div>

  <div class="feed-list" id="feedList">
    <div class="loading-state">Loading feed...</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://jllugkiojeoopitdvzsa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DnBMNLaSu61ykJ6P_fI2fw_D9DdAScn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MAX_CHARS = 280;
let players = [];
let teamAssignments = {};
let posts = [];
let posting = false;

async function init() {
  const [pRes, taRes, feedRes] = await Promise.all([
    sb.from('players').select('id,first_name,last_name').order('last_name'),
    sb.from('settings').select('value').eq('key','team_assignments').maybeSingle(),
    sb.from('trash_talk').select('*').order('created_at', { ascending: false }),
  ]);

  players = pRes.data || [];
  if (taRes.data?.value) try { teamAssignments = JSON.parse(taRes.data.value); } catch {}

  populatePlayerSelect();

  posts = (feedRes.data || []);
  renderFeed();
  subscribeRealtime();
}

function populatePlayerSelect() {
  const sel = document.getElementById('playerSelect');
  const teamA = players.filter(p => teamAssignments[p.id] === 'A');
  const teamB = players.filter(p => teamAssignments[p.id] === 'B');
  const unassigned = players.filter(p => !teamAssignments[p.id]);

  const makeOption = (p) => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.first_name} ${p.last_name}`;
    return o;
  };

  if (teamA.length) {
    const grp = document.createElement('optgroup');
    grp.label = 'Team Bova';
    teamA.forEach(p => grp.appendChild(makeOption(p)));
    sel.appendChild(grp);
  }
  if (teamB.length) {
    const grp = document.createElement('optgroup');
    grp.label = 'The Challengers';
    teamB.forEach(p => grp.appendChild(makeOption(p)));
    sel.appendChild(grp);
  }
  unassigned.forEach(p => sel.appendChild(makeOption(p)));
}

function renderFeed() {
  const list = document.getElementById('feedList');
  updateFeedTitle();

  if (!posts.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-heading">No shots fired.</div>
      <div class="empty-sub">Be the first to talk trash</div>
    </div>`;
    return;
  }

  list.innerHTML = posts.map(buildPostHTML).join('');
}

function buildPostHTML(post) {
  const teamClass = post.team === 'A' ? 'team-a' : post.team === 'B' ? 'team-b' : 'team-none';
  const teamBadge = post.team === 'A'
    ? `<span class="post-team-badge team-a">Team Bova</span>`
    : post.team === 'B'
    ? `<span class="post-team-badge team-b">Challengers</span>`
    : '';
  return `<div class="post-card ${teamClass}">
    <div class="post-meta">
      <span class="post-name">${esc(post.player_name)}</span>
      ${teamBadge}
      <span class="post-time">${formatTime(post.created_at)}</span>
    </div>
    <div class="post-message">${esc(post.message)}</div>
  </div>`;
}

function prependPost(post) {
  posts.unshift(post);
  updateFeedTitle();

  const list = document.getElementById('feedList');
  const empty = list.querySelector('.empty-state,.loading-state');
  if (empty) list.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.innerHTML = buildPostHTML(post);
  const card = wrapper.firstElementChild;
  list.insertBefore(card, list.firstChild);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function updateFeedTitle() {
  const n = posts.length;
  document.getElementById('feedTitle').textContent = n ? `Feed — ${n} post${n !== 1 ? 's' : ''}` : 'Feed';
}

async function postMessage() {
  if (posting) return;
  const sel = document.getElementById('playerSelect');
  const msgEl = document.getElementById('messageInput');
  const btn = document.getElementById('submitBtn');

  const playerId = sel.value;
  const message = msgEl.value.trim();
  if (!playerId || !message) return;

  const player = players.find(p => p.id === playerId);
  if (!player) return;

  posting = true;
  btn.disabled = true;
  btn.textContent = 'Posting...';

  const { error } = await sb.from('trash_talk').insert({
    player_name: `${player.first_name} ${player.last_name}`,
    team: teamAssignments[playerId] || null,
    message,
  });

  posting = false;
  btn.textContent = 'Post It';

  if (error) {
    showToast('Error posting. Try again.', 'error');
    updateCharCount();
    return;
  }

  msgEl.value = '';
  updateCharCount();
}

function subscribeRealtime() {
  sb.channel('trash-talk-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'trash_talk' }, payload => {
      // Avoid duplicate if it came from our own post (already shown optimistically)
      if (!posts.find(p => p.id === payload.new.id)) {
        prependPost(payload.new);
      }
    })
    .subscribe();
}

function formatTime(ts) {
  const d = new Date(ts);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let _toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function updateCharCount() {
  const msg = document.getElementById('messageInput').value;
  const remaining = MAX_CHARS - msg.length;
  const countEl = document.getElementById('charCount');
  const sel = document.getElementById('playerSelect');
  const btn = document.getElementById('submitBtn');

  countEl.textContent = remaining;
  countEl.className = 'compose-char' + (remaining < 20 ? ' warn' : '') + (remaining < 0 ? ' over' : '');
  btn.disabled = posting || !sel.value || msg.trim().length === 0 || remaining < 0;
}

document.getElementById('messageInput').addEventListener('input', updateCharCount);
document.getElementById('playerSelect').addEventListener('change', updateCharCount);

async function loadNavLogo() {
  const { data } = await sb.from('settings').select('value').eq('key', 'logo_url').maybeSingle();
  if (data?.value) {
    const img = document.getElementById('navLogoImg');
    const svg = document.getElementById('navLogoSvg');
    if (img) { img.src = data.value; img.style.display = 'block'; }
    if (svg) svg.style.display = 'none';
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}

init();
loadNavLogo();
</script>
</body>
</html>
