<style>
:root{--ink:#1a1008;--gold:#c09030;--gold-l:#d4aa50;--gold-p:#e8cc80;--cream:#f0e6cc;--red:#8a1e10;--green:#1a4010;--border:rgba(192,144,48,0.28);--bg:#f5ede0;--card:#fdf8f0;--muted:rgba(26,16,8,0.4);--blue:#4a6a8a;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;}
a{color:inherit;text-decoration:none;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(14,11,6,0.97);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:0.45rem;color:var(--cream);}
.nav-logo em{font-style:italic;color:var(--gold);}
.nav-links{display:flex;gap:1.2rem;align-items:center;}
.nav-links a{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(240,230,204,0.4);}
.nav-links a:hover{color:var(--cream);}
.nav-links a.active{color:var(--gold);}
@media(max-width:520px){.nav{padding:0 1rem;}.nav-links a:not(.active){display:none;}}

/* PAGE HEADER */
.page-header{max-width:780px;margin:0 auto;padding:2.5rem 2rem 1.5rem;}
.page-eyebrow{font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(192,144,48,0.5);margin-bottom:0.5rem;}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;line-height:1;margin-bottom:0.3rem;}
.page-title em{font-style:italic;color:var(--gold);}
.page-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);}

/* MAIN */
.main{max-width:780px;margin:0 auto;padding:1.5rem 2rem 4rem;}
@media(max-width:520px){.main{padding:1rem 1rem 3rem;}.page-header{padding:1.5rem 1rem 1rem;}}

/* COMPOSE */
.compose-card{background:var(--card);border:1px solid var(--border);padding:1.5rem;margin-bottom:2rem;}
.compose-id{display:flex;align-items:baseline;gap:0.5rem;margin-bottom:0.8rem;}
.compose-label{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);flex-shrink:0;}
.compose-player-name{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;color:var(--ink);}
.compose-textarea-wrap{position:relative;}
.compose-textarea{width:100%;font-family:'Barlow',sans-serif;font-size:0.92rem;padding:0.75rem 0.9rem;background:var(--bg);border:1px solid var(--border);color:var(--ink);resize:vertical;min-height:72px;max-height:160px;outline:none;line-height:1.55;}
.compose-textarea:focus{border-color:var(--gold);}
.compose-textarea::placeholder{color:var(--muted);font-style:italic;}

/* @MENTION DROPDOWN */
.mention-dropdown{display:none;position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:50;background:rgba(14,11,6,0.97);border:1px solid var(--border);max-height:180px;overflow-y:auto;}
.mention-dropdown.open{display:block;}
.mention-item{font-family:'Barlow',sans-serif;font-size:0.88rem;padding:0.6rem 0.9rem;color:var(--cream);cursor:pointer;transition:background 0.12s;}
.mention-item:hover{background:rgba(192,144,48,0.15);}
.mention-item:active{background:rgba(192,144,48,0.25);}

/* REPLY BANNER */
.reply-banner{display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;padding:0.45rem 0.75rem;background:rgba(192,144,48,0.07);border-left:2px solid var(--gold);}
.reply-label{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.reply-target{font-family:'Barlow',sans-serif;font-size:0.82rem;font-weight:500;color:var(--ink);flex:1;}
.reply-cancel{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:0 0.2rem;line-height:1;transition:color 0.15s;}
.reply-cancel:hover{color:var(--red);}

.compose-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.65rem;}
.compose-char{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.1em;color:var(--muted);}
.compose-char.warn{color:var(--gold);}
.compose-char.over{color:var(--red);}
.compose-submit{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:0.55rem 1.6rem;border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer;transition:all 0.18s;}
.compose-submit:hover:not(:disabled){background:var(--gold-l);border-color:var(--gold-l);}
.compose-submit:disabled{opacity:0.38;cursor:not-allowed;}

/* FEED HEADER */
.feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.feed-title{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--muted);}
.live-badge{display:flex;align-items:center;gap:0.35rem;font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.live-badge .dot{width:6px;height:6px;border-radius:50%;background:#2a7a20;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}

/* THREADS */
.feed-list{display:flex;flex-direction:column;gap:0.75rem;}
.thread{display:flex;flex-direction:column;}
.reply-list{display:flex;flex-direction:column;margin-left:1.25rem;border-left:1px solid var(--border);}

/* POST CARD */
.post-card{background:var(--card);border:1px solid var(--border);border-left-width:3px;padding:1rem 1.2rem;animation:slideIn 0.22s ease;}
.post-card.reply{border-left-width:2px;padding:0.7rem 1rem;border-top:none;animation:none;}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.post-card.team-a{border-left-color:var(--gold);background:linear-gradient(to right,rgba(192,144,48,0.04),var(--card));}
.post-card.team-b{border-left-color:var(--blue);background:linear-gradient(to right,rgba(74,106,138,0.06),var(--card));}
.post-card.team-none{border-left-color:rgba(26,16,8,0.18);}
.post-meta{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;flex-wrap:wrap;}
.post-name{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;color:var(--ink);}
.post-card.reply .post-name{font-size:0.85rem;}
.post-team-badge{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.15rem 0.45rem;}
.post-team-badge.team-a{background:rgba(192,144,48,0.14);color:var(--gold);}
.post-team-badge.team-b{background:rgba(74,106,138,0.14);color:var(--blue);}
.post-time{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.08em;color:var(--muted);margin-left:auto;}
.post-message{font-family:'Barlow',sans-serif;font-size:0.95rem;font-weight:400;color:var(--ink);line-height:1.55;}
.post-card.reply .post-message{font-size:0.88rem;}
.mention{color:var(--gold);font-weight:500;}

/* REPLY ACTION */
.post-actions{margin-top:0.45rem;}
.reply-btn{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;transition:color 0.15s;}
.reply-btn:hover{color:var(--gold);}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:4rem 2rem;border:1px solid var(--border);background:var(--card);}
.empty-heading{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;font-style:italic;color:rgba(192,144,48,0.3);margin-bottom:0.6rem;}
.empty-sub{font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);}
.loading-state{text-align:center;padding:3rem;font-family:'DM Mono',monospace;font-size:0.5rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.65rem 1.2rem;background:rgba(14,11,6,0.95);border:1px solid var(--border);transform:translateY(120px);opacity:0;transition:all 0.28s ease;z-index:999;max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{color:var(--gold);}
.toast.error{color:var(--red);}

/* HOLE-IN-ONE OVERLAY */
.hio-overlay{position:fixed;inset:0;z-index:9999;background:rgba(10,7,2,0.97);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:hioIn 0.4s ease;}
@keyframes hioIn{from{opacity:0;}to{opacity:1;}}
.hio-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.confetti-piece{position:absolute;top:-20px;border-radius:2px;animation:confettiFall linear forwards;}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg) scaleX(1);opacity:1;}
  70%{opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg) scaleX(-1);opacity:0;}
}
.hio-content{position:relative;z-index:1;text-align:center;padding:2rem;pointer-events:none;}
.hio-eyebrow{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.5em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;}
.hio-name{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,12vw,5.5rem);font-weight:900;color:var(--cream);line-height:1;margin-bottom:0.5rem;}
.hio-detail{font-family:'Barlow Condensed',sans-serif;font-size:clamp(1rem,4vw,1.4rem);letter-spacing:0.35em;text-transform:uppercase;color:var(--gold-p);margin-bottom:2rem;}
.hio-sub{font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.3em;text-transform:uppercase;color:rgba(240,230,204,0.25);}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.min.js" integrity="sha384-iWpUQPQzWsFiosLgsS8o+e6E8y3Gm+EW2m/vAAo7A2H3fuc4KOKEx+5CAord2H2z" crossorigin="anonymous"></script>

<script>
const sb = window.tourney.db;

const MAX_CHARS = 280;
let me = null;
let players = [];
let teamAssignments = {};
let posts = [];
let _celebStyle = 'full';
let posting = false;
let replyingTo = null;
let mentionState = null;

// ── AUTH + INIT ──────────────────────────────────────────────────
async function init() {
  const { data: sess } = await sb.auth.getSession();
  if (!sess?.session?.user) {
    const _pM = location.pathname.match(/\/t\/([^/?#]+)/);
    const _pfx = _pM ? `/t/${_pM[1]}` : '';
    window.location.href = `${_pfx}/login?redirect=${_pfx}/feed`;
    return;
  }
  const email = sess.session.user.email;

  const { tournament } = await window.tourney.ready;

  const [pRes, taRes, meRes, feedRes, celebRes, namesRes] = await Promise.all([
    sb.from('players').select('id,first_name,last_name').eq('tournament_id', tournament.id).order('last_name'),
    sb.from('settings').select('value').eq('tournament_id', tournament.id).eq('key', 'team_assignments').maybeSingle(),
    sb.from('players').select('id,first_name,last_name').eq('tournament_id', tournament.id).eq('email', email.toLowerCase()).maybeSingle(),
    sb.from('trash_talk').select('*').eq('tournament_id', tournament.id).order('created_at', { ascending: false }),
    sb.from('settings').select('value').eq('tournament_id', tournament.id).eq('key', 'celebration_style').maybeSingle(),
    sb.from('settings').select('key,value').eq('tournament_id', tournament.id).in('key',['team_a_name','team_b_name']),
  ]);
  if (celebRes.data?.value) _celebStyle = celebRes.data.value;
  const _nm = {};
  (namesRes.data || []).forEach(r => { _nm[r.key] = r.value; });
  window._teamAName = _nm.team_a_name || 'Team A';
  window._teamBName = _nm.team_b_name || 'Team B';

  players = pRes.data || [];
  if (taRes.data?.value) try { teamAssignments = JSON.parse(taRes.data.value); } catch {}
  me = meRes.data;

  if (me) {
    document.getElementById('composeName').textContent = `${me.first_name} ${me.last_name}`;
  } else {
    document.getElementById('composeCard').innerHTML =
      `<div style="text-align:center;padding:1.5rem;font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);">No player record found for this account.</div>`;
  }

  posts = feedRes.data || [];
  renderFeed();
  subscribeRealtime(tournament.id);
  subscribeHoleInOne(tournament.id);

  // HIO celebration from push notification click
  const _sp = new URLSearchParams(window.location.search);
  if (_sp.get('hio') === '1' && window.celebrate && _celebStyle !== 'off') {
    window.celebrate.show({ name: _sp.get('player') || '', hole: _sp.get('hole') || '', style: _celebStyle });
  }

  // Deep link: scroll to specific post
  const targetId = _sp.get('post');
  if (targetId) {
    setTimeout(() => {
      const el = document.getElementById(`post-${targetId}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 400);
  }

  // Event delegation for reply buttons
  document.getElementById('feedList').addEventListener('click', e => {
    const btn = e.target.closest('.reply-btn');
    if (btn) startReply(btn.dataset.postId, btn.dataset.playerName);
  });
}

// ── THREAD BUILDING ───────────────────────────────────────────────
function buildThreads() {
  const byId = {};
  const roots = [];
  // posts are DESC — iterate to build map
  posts.forEach(p => { byId[p.id] = { ...p, replies: [] }; });
  posts.forEach(p => {
    if (p.parent_id && byId[p.parent_id]) {
      byId[p.parent_id].replies.unshift(byId[p.id]); // unshift → replies end up ASC
    } else if (!p.parent_id) {
      roots.push(byId[p.id]);
    }
  });
  return roots;
}

// ── RENDER ───────────────────────────────────────────────────────
function renderFeed() {
  const list = document.getElementById('feedList');
  updateFeedTitle();

  if (!posts.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-heading">No shots fired.</div>
      <div class="empty-sub">Be the first to talk trash</div>
    </div>`;
    return;
  }

  const threads = buildThreads();
  list.innerHTML = threads.map(buildThreadHTML).join('');
}

function buildThreadHTML(node) {
  const replies = node.replies || [];
  const replyHTML = replies.length
    ? `<div class="reply-list">${replies.map(r => buildPostHTML(r, true)).join('')}</div>`
    : '';
  return `<div class="thread" id="thread-${node.id}">${buildPostHTML(node, false)}${replyHTML}</div>`;
}

function buildPostHTML(post, isReply) {
  const teamClass = post.team === 'A' ? 'team-a' : post.team === 'B' ? 'team-b' : 'team-none';
  const teamBadge = post.team === 'A'
    ? `<span class="post-team-badge team-a">${esc(window._teamAName || 'Team A')}</span>`
    : post.team === 'B'
    ? `<span class="post-team-badge team-b">${esc(window._teamBName || 'Team B')}</span>`
    : '';
  const replyBtn = !isReply && me
    ? `<div class="post-actions"><button class="reply-btn" data-post-id="${post.id}" data-player-name="${esc(post.player_name)}">Reply</button></div>`
    : '';
  return `<div class="post-card ${teamClass}${isReply ? ' reply' : ''}" id="post-${post.id}">
    <div class="post-meta">
      <span class="post-name">${esc(post.player_name)}</span>
      ${teamBadge}
      <span class="post-time">${formatTime(post.created_at)}</span>
    </div>
    <div class="post-message">${buildPostMessage(post.message)}</div>
    ${replyBtn}
  </div>`;
}

function buildPostMessage(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/@([A-Za-z][A-Za-z '.\-]*[A-Za-z])/g,'<span class="mention">@$1</span>');
}

// ── OPTIMISTIC UPDATES ────────────────────────────────────────────
function prependThread(post) {
  const list = document.getElementById('feedList');
  const empty = list.querySelector('.empty-state,.loading-state');
  if (empty) list.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.innerHTML = buildThreadHTML({ ...post, replies: [] });
  list.insertBefore(wrapper.firstElementChild, list.firstChild);
}

function insertReply(post) {
  const thread = document.getElementById(`thread-${post.parent_id}`);
  if (!thread) { renderFeed(); return; }
  let replyList = thread.querySelector('.reply-list');
  if (!replyList) {
    replyList = document.createElement('div');
    replyList.className = 'reply-list';
    thread.appendChild(replyList);
  }
  replyList.insertAdjacentHTML('beforeend', buildPostHTML(post, true));
}

// ── REPLY UX ─────────────────────────────────────────────────────
function startReply(postId, playerName) {
  replyingTo = { id: postId, player_name: playerName };
  document.getElementById('replyTarget').textContent = playerName;
  document.getElementById('replyBanner').style.display = '';

  const ta = document.getElementById('messageInput');
  const prefix = `@${playerName} `;
  if (!ta.value.startsWith(prefix)) ta.value = prefix + ta.value;
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  updateCharCount();
  document.querySelector('.compose-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('replyBanner').style.display = 'none';
  document.getElementById('replyTarget').textContent = '';
}

// ── POST ─────────────────────────────────────────────────────────
async function postMessage() {
  if (posting || !me) return;
  const msgEl = document.getElementById('messageInput');
  const btn = document.getElementById('submitBtn');
  const message = msgEl.value.trim();
  if (!message) return;

  const { tournament } = await window.tourney.ready;

  posting = true;
  btn.disabled = true;
  btn.textContent = 'Posting...';

  const { error } = await sb.from('trash_talk').insert({
    tournament_id: tournament.id,
    player_id: me.id,
    player_name: `${me.first_name} ${me.last_name}`,
    team: teamAssignments[me.id] || null,
    message,
    parent_id: replyingTo?.id || null,
  });

  posting = false;
  btn.textContent = 'Post It';

  if (error) {
    showToast('Error posting. Try again.', 'error');
    updateCharCount();
    return;
  }

  msgEl.value = '';
  cancelReply();
  hideMentionDropdown();
  updateCharCount();
}

// ── REALTIME ─────────────────────────────────────────────────────
function subscribeRealtime(tournamentId) {
  sb.channel('trash-talk-channel')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'trash_talk',
      filter: `tournament_id=eq.${tournamentId}`,
    }, payload => {
      const post = payload.new;
      if (posts.find(p => p.id === post.id)) return;
      posts.push(post);
      if (post.parent_id) {
        insertReply(post);
      } else {
        prependThread(post);
      }
      updateFeedTitle();
    })
    .subscribe();
}

// ── HOLE-IN-ONE ──────────────────────────────────────────────────
function subscribeHoleInOne(tournamentId) {
  sb.channel('hio-watch')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'scores',
      filter: `tournament_id=eq.${tournamentId}`,
    }, async payload => {
      const score = payload.new;
      const strokes = score.gross_score ?? score.strokes ?? score.score;
      if (strokes !== 1) return;

      let playerName = score.player_name || '';
      if (!playerName && score.player_id) {
        const { data } = await sb.from('players')
          .select('first_name,last_name')
          .eq('id', score.player_id)
          .single();
        if (data) playerName = `${data.first_name} ${data.last_name}`;
      }
      if (window.celebrate && _celebStyle !== 'off') {
        window.celebrate.show({ name: playerName, hole: score.hole ?? score.hole_number ?? '', style: _celebStyle });
      } else if (_celebStyle !== 'off') {
        showHoleInOne(playerName, score.hole ?? score.hole_number ?? '');
      }
    })
    .subscribe();
}

function showHoleInOne(playerName, hole) {
  let overlay = document.getElementById('hioOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'hio-overlay';
    overlay.id = 'hioOverlay';
    overlay.innerHTML = `
      <div class="hio-confetti" id="hioConfetti"></div>
      <div class="hio-content">
        <div class="hio-eyebrow">Hole in One</div>
        <div class="hio-name" id="hioName"></div>
        <div class="hio-detail" id="hioDetail"></div>
        <div class="hio-sub">tap anywhere to dismiss</div>
      </div>`;
    overlay.addEventListener('click', dismissHoleInOne);
    document.body.appendChild(overlay);
  }

  document.getElementById('hioName').textContent = playerName || 'Incredible shot';
  document.getElementById('hioDetail').textContent = hole ? `Hole ${hole} · Ace` : 'Ace';
  overlay.style.display = 'flex';
  spawnConfetti();

  // Auto-dismiss after 12 seconds
  clearTimeout(overlay._t);
  overlay._t = setTimeout(dismissHoleInOne, 12000);
}

function dismissHoleInOne() {
  const overlay = document.getElementById('hioOverlay');
  if (overlay) overlay.style.display = 'none';
}

function spawnConfetti() {
  const container = document.getElementById('hioConfetti');
  if (!container) return;
  container.innerHTML = '';
  const colors = ['#c09030','#d4aa50','#e8cc80','#2a7a20','#8a1e10','#f0e6cc','#4a8a60'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 5 + Math.random() * 9;
    el.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size * (0.4 + Math.random()*0.8)}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.8}s;`;
    container.appendChild(el);
  }
}

// ── @MENTION AUTOCOMPLETE ─────────────────────────────────────────
function handleMessageInput() {
  updateCharCount();

  const ta = document.getElementById('messageInput');
  const before = ta.value.slice(0, ta.selectionStart);
  const match = before.match(/@([A-Za-z]*)$/);

  if (match) {
    mentionState = { atPos: before.lastIndexOf('@'), query: match[1].toLowerCase() };
    showMentionDropdown(mentionState.query);
  } else {
    mentionState = null;
    hideMentionDropdown();
  }
}

function showMentionDropdown(query) {
  const matches = players
    .filter(p => {
      const full = `${p.first_name} ${p.last_name}`.toLowerCase();
      return full.includes(query) || p.first_name.toLowerCase().startsWith(query) || p.last_name.toLowerCase().startsWith(query);
    })
    .slice(0, 6);

  const dd = document.getElementById('mentionDropdown');
  if (!matches.length) { hideMentionDropdown(); return; }

  dd.innerHTML = matches.map(p =>
    `<div class="mention-item" data-name="${esc(p.first_name)} ${esc(p.last_name)}">${esc(p.first_name)} ${esc(p.last_name)}</div>`
  ).join('');
  dd.classList.add('open');
}

function hideMentionDropdown() {
  const dd = document.getElementById('mentionDropdown');
  dd.innerHTML = '';
  dd.classList.remove('open');
}

function insertMention(name) {
  const ta = document.getElementById('messageInput');
  const cursor = ta.selectionStart;
  const before = ta.value.slice(0, mentionState.atPos);
  const after = ta.value.slice(cursor);
  const inserted = `@${name} `;
  ta.value = before + inserted + after;
  const newPos = before.length + inserted.length;
  ta.focus();
  ta.setSelectionRange(newPos, newPos);
  mentionState = null;
  hideMentionDropdown();
  updateCharCount();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('messageInput').addEventListener('input', handleMessageInput);
  document.getElementById('messageInput').addEventListener('keydown', e => {
    const dd = document.getElementById('mentionDropdown');
    if (!dd.classList.contains('open')) return;
    if (e.key === 'Escape') { hideMentionDropdown(); e.preventDefault(); }
    if (e.key === 'Enter' && dd.firstElementChild) {
      insertMention(dd.firstElementChild.dataset.name);
      e.preventDefault();
    }
  });
  document.getElementById('mentionDropdown').addEventListener('mousedown', e => {
    const item = e.target.closest('.mention-item');
    if (item) { e.preventDefault(); insertMention(item.dataset.name); }
  });
});

// ── HELPERS ───────────────────────────────────────────────────────
function updateFeedTitle() {
  const n = posts.filter(p => !p.parent_id).length;
  document.getElementById('feedTitle').textContent = n ? `Feed — ${n} post${n !== 1 ? 's' : ''}` : 'Feed';
}

function updateCharCount() {
  const msg = document.getElementById('messageInput').value;
  const remaining = MAX_CHARS - msg.length;
  const countEl = document.getElementById('charCount');
  const btn = document.getElementById('submitBtn');
  countEl.textContent = remaining;
  countEl.className = 'compose-char' + (remaining < 20 ? ' warn' : '') + (remaining < 0 ? ' over' : '');
  btn.disabled = posting || !me || msg.trim().length === 0 || remaining < 0;
}

function formatTime(ts) {
  const d = new Date(ts);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

let _toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadNavLogo() {
  const { tournament } = await window.tourney.ready;
  const { data } = await sb.from('settings').select('value').eq('tournament_id', tournament.id).eq('key', 'logo_url').maybeSingle();
  if (data?.value) {
    const img = document.getElementById('navLogoImg');
    const svg = document.getElementById('navLogoSvg');
    if (img) { img.src = data.value; img.style.display = 'block'; }
    if (svg) svg.style.display = 'none';
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}

init();
loadNavLogo();
// Admin link in desktop nav

  const { data: sess } = await sb.auth.getSession();
  const email = sess?.session?.user?.email;
  if (!email) return;
  const { tournament } = await window.tourney.ready;
  const _adminHref = location.pathname.match(/\/t\/([^/?#]+)/) ? `/t/${tournament.slug}/admin` : '/admin';
  const { data: ac } = await sb.from('tournament_admins').select('id').eq('tournament_id', tournament.id).eq('email', email.toLowerCase()).maybeSingle();
  if (ac) {
    const nl = document.querySelector('.nav-links');
    if (nl) { const a = document.createElement('a'); a.href = _adminHref; a.textContent = 'Admin'; nl.appendChild(a); }
  }
})();
